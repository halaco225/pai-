name: SMG Daily Comments Pull

on:
  schedule:
    # 5 AM EST (10 AM UTC) every day
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD). Leave blank for yesterday.'
        required: false

jobs:
  pull-smg-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Download SMG comments and upload to PAi
        env:
          SMG_USER:               ${{ secrets.SMG_USER }}
          SMG_PASSWORD:           ${{ secrets.SMG_PASSWORD }}
          PAI_BASE_URL:           ${{ secrets.PAI_BASE_URL }}
          INTEL_AUTOMATION_TOKEN: ${{ secrets.INTEL_AUTOMATION_TOKEN }}
          TARGET_DATE:            ${{ github.event.inputs.date }}
        run: node .github/scripts/smg-pull.js
