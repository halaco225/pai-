<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P.AI — Change Password</title>
<link rel="stylesheet" href="/css/styles.css" />
<style>
  .pw-shell { max-width: 460px; margin: 64px auto; padding: 0 20px; }
  .pw-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
  }
  .pw-card h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
  .pw-card .lede { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin: 8px 0 24px; }
  .pw-field { margin-bottom: 16px; }
  .pw-field label {
    display: block; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-muted); margin-bottom: 6px;
  }
  .pw-field input {
    width: 100%; padding: 11px 13px; font-size: 14px;
    background: var(--surface-2); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .pw-btn {
    width: 100%; padding: 12px; margin-top: 8px;
    font-size: 13px; font-weight: 800; letter-spacing: 0.8px;
    background: var(--accent); color: #fff;
    border: 0; border-radius: 8px; cursor: pointer;
  }
  .pw-btn:disabled { opacity: 0.6; cursor: default; }
  .pw-msg { margin-top: 14px; font-size: 13px; padding: 10px 13px; border-radius: 6px; display: none; }
  .pw-msg.err { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
  .pw-msg.ok  { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; }
  .pw-back { display: block; text-align: center; margin-top: 18px; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="pw-shell">
  <div class="pw-card">
    <h1>Change your password</h1>
    <p class="lede" id="lede">Pick something only you know. At least 8 characters.</p>
    <form id="pwForm">
      <div class="pw-field" id="currentField">
        <label for="current">Current password</label>
        <input type="password" id="current" autocomplete="current-password" />
      </div>
      <div class="pw-field">
        <label for="next">New password</label>
        <input type="password" id="next" autocomplete="new-password" minlength="8" required />
      </div>
      <div class="pw-field">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" autocomplete="new-password" minlength="8" required />
      </div>
      <button type="submit" class="pw-btn" id="pwBtn">SAVE PASSWORD</button>
      <div class="pw-msg" id="pwMsg"></div>
    </form>
    <a class="pw-back" id="pwBack" href="/dashboard">Back to dashboard</a>
  </div>
</div>

<script>
  let forced = false;

  async function init() {
    const res = await fetch('/api/auth/me');
    if (!res.ok) { window.location.href = '/'; return; }
    const { user } = await res.json();
    forced = !!(user && user.must_change);
    if (forced) {
      document.getElementById('lede').textContent =
        'This is your first sign-in. Choose a new password before you can use P.AI. At least 8 characters.';
      document.getElementById('pwBack').style.display = 'none';
      // Nothing to prove: the sign-in that got you here proved it. Leaving the
      // field visible invites the browser to autofill a stale saved password.
      const cf = document.getElementById('currentField');
      cf.style.display = 'none';
      document.getElementById('current').value = '';
    } else {
      document.getElementById('current').required = true;
    }
  }

  function show(kind, text) {
    const el = document.getElementById('pwMsg');
    el.className = 'pw-msg ' + kind;
    el.textContent = text;
    el.style.display = 'block';
  }

  document.getElementById('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('pwBtn');
    const next = document.getElementById('next').value;

    if (next !== document.getElementById('confirm').value) {
      show('err', 'The two new passwords do not match.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'SAVING...';
    try {
      const res = await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          currentPassword: document.getElementById('current').value,
          newPassword: next
        })
      });
      const data = await res.json();
      if (res.ok) {
        show('ok', 'Password saved. Taking you to the dashboard...');
        setTimeout(() => { window.location.href = '/dashboard'; }, 900);
        return;
      }
      show('err', data.error || 'Could not change the password.');
    } catch {
      show('err', 'Network error. Please try again.');
    }
    btn.disabled = false;
    btn.textContent = 'SAVE PASSWORD';
  });

  init();
</script>
</body>
</html>
