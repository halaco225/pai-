<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Readiness Check</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0049C9; --blue-dark:#003799; --red:#D91823; --green:#1CB145;
    --ink:#101828; --muted:#5a6475; --line:#dfe3ea; --bg:#f4f6fa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);overflow:hidden;
       font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       font-size:17px;line-height:1.5;}

  /* One question fills the screen: header, the question, then the buttons. */
  .app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;}

  header{background:var(--blue);color:#fff;padding:14px 16px 12px;flex:none;}
  header img{height:26px;display:block;margin-bottom:8px;}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.2px;}
  .bar{height:5px;background:rgba(255,255,255,.28);border-radius:4px;margin-top:11px;overflow:hidden;}
  .bar span{display:block;height:100%;background:#fff;width:0;transition:width .3s ease;}
  .count{font-size:12.5px;opacity:.9;margin-top:7px;}

  .stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 16px 8px;-webkit-overflow-scrolling:touch;}
  .slide{animation:in .22s ease;}
  .slide.back{animation:inBack .22s ease;}
  @keyframes in{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
  @keyframes inBack{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}

  .q-num{font-size:12.5px;font-weight:700;color:var(--blue);letter-spacing:.5px;text-transform:uppercase;}
  .q-title{margin:9px 0 18px;font-weight:600;font-size:19px;line-height:1.4;}
  .hint{font-size:14.5px;color:var(--muted);margin:-10px 0 16px;}

  label.opt{display:flex;gap:13px;align-items:flex-start;padding:15px;border:1.5px solid var(--line);
            border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff;}
  label.opt:active{background:#eef2fb;}
  label.opt.on{border-color:var(--blue);background:#eef3fe;}
  label.opt input{width:23px;height:23px;margin:0;flex:none;accent-color:var(--blue);}

  input[type=text],select,textarea{width:100%;padding:15px;font:inherit;border:1.5px solid var(--line);
            border-radius:12px;background:#fff;color:var(--ink);}
  textarea{min-height:150px;resize:vertical;}

  .photo-btn{display:block;width:100%;padding:18px;border:2px dashed var(--blue);border-radius:13px;
             background:#eef3fe;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;text-align:center;}
  .photo-btn:disabled{border-color:var(--line);background:#fff;color:var(--muted);}
  .thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .thumb{position:relative;width:92px;height:92px;border-radius:11px;overflow:hidden;border:1px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb button{position:absolute;top:3px;right:3px;width:27px;height:27px;border:none;border-radius:50%;
                background:rgba(16,24,40,.78);color:#fff;font-size:15px;line-height:1;cursor:pointer;}

  .foot{flex:none;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
        background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;}
  button.go{flex:1;padding:17px;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--blue);
            border:none;border-radius:13px;cursor:pointer;}
  button.go:disabled{background:#92a6c9;}
  button.back{padding:17px 18px;font:inherit;font-weight:600;color:var(--blue);background:#fff;
              border:1.5px solid var(--line);border-radius:13px;cursor:pointer;}
  .msg{color:var(--red);font-weight:600;font-size:14.5px;padding:0 16px 10px;background:#fff;}
  .swipe-tip{text-align:center;color:var(--muted);font-size:12.5px;padding:6px 0 2px;}

  /* Intro and results scroll normally. */
  .scrollable{overflow-y:auto;padding:20px 16px 30px;}
  .intro{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:16px;}
  .score{background:var(--blue);color:#fff;border-radius:16px;padding:24px;text-align:center;margin-bottom:18px;}
  .score b{display:block;font-size:42px;line-height:1.1;}
  .r{background:#fff;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:12px;padding:15px;margin-bottom:12px;}
  .r.wrong{border-left-color:var(--red);}
  .mark{font-weight:700;}
  .mark.ok{color:var(--green);} .mark.no{color:var(--red);}
  .why{background:#f4f6fa;border-radius:9px;padding:12px;margin-top:11px;font-size:15.5px;}
  .quiet{color:var(--muted);font-size:14.5px;}
</style>
</head>
<body>

<div class="app">
  <header>
    <img src="/images/logo-wordmark.png" alt="Ayvaz Pizza" onerror="this.style.display='none'">
    <h1 id="title">Readiness Check</h1>
    <div class="bar"><span id="progress"></span></div>
    <div class="count" id="count"></div>
  </header>

  <div class="stage" id="stage"><div class="intro">Loading…</div></div>
  <div class="msg" id="msg" style="display:none"></div>
  <div class="foot" id="foot" style="display:none">
    <button class="back" id="back" type="button">Back</button>
    <button class="go" id="next" type="button">Next</button>
  </div>
</div>

<script>
const AUDIT_ID = new URLSearchParams(location.search).get('id') || 'steritech-readiness';
const DRAFT_KEY = 'audit-draft-' + AUDIT_ID;

let FORM = null;
let STORES = [];
let at = -1;                 // -1 is the intro screen
const answers = {};          // { n: string | number[] }
const photos  = {};          // { n: [{file, url}] }

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Draft save/restore. Pictures cannot be saved, so only answers come back.
function saveDraft(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(answers)); }catch(e){} }
function loadDraft(){ try{ return JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); }catch(e){ return {}; } }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

async function start(){
  const res = await fetch('/api/audits/form?id=' + encodeURIComponent(AUDIT_ID));
  if (!res.ok){
    document.getElementById('stage').innerHTML =
      '<div class="intro">This walk is not available. Ask your manager for a new link.</div>';
    return;
  }
  FORM = await res.json();
  STORES = await fetch('/api/audits/stores').then(r => r.json()).catch(() => []);
  document.getElementById('title').textContent = FORM.title;
  Object.assign(answers, loadDraft());
  draw();
}

// ── The screens ─────────────────────────────────────────────────────────────
function draw(dir){
  const stage = document.getElementById('stage');
  const foot  = document.getElementById('foot');
  say('');

  if (at < 0){
    stage.className = 'stage scrollable';
    stage.innerHTML = `<div class="intro">${esc(FORM.description)}</div>
      <div class="intro quiet">${FORM.questions.length} questions. One at a time —
        swipe or hit Next to move on.</div>`;
    foot.style.display = 'flex';
    document.getElementById('back').style.display = 'none';
    document.getElementById('next').textContent = 'Start';
    setProgress(0, '');
    return;
  }

  const q = FORM.questions[at];
  stage.className = 'stage';
  stage.innerHTML = `<div class="slide ${dir === 'back' ? 'back' : ''}">
      <div class="q-num">Question ${at + 1}${q.points ? ' · ' + q.points + (q.points > 1 ? ' points' : ' point') : ''}</div>
      <div class="q-title">${esc(q.title)}</div>
      ${body(q)}
    </div>
    <div class="swipe-tip">swipe to move on</div>`;

  wire(q);
  foot.style.display = 'flex';
  document.getElementById('back').style.display = at === 0 ? 'none' : 'block';
  document.getElementById('next').textContent = at === FORM.questions.length - 1 ? 'Send my answers' : 'Next';
  setProgress((at + 1) / FORM.questions.length, `Question ${at + 1} of ${FORM.questions.length}`);
  stage.scrollTop = 0;
}

function setProgress(fraction, label){
  document.getElementById('progress').style.width = Math.round(fraction * 100) + '%';
  document.getElementById('count').textContent = label;
}

function body(q){
  const given = answers[q.n];

  if (q.type === 'single' || q.type === 'multi'){
    const kind = q.type === 'multi' ? 'checkbox' : 'radio';
    const picked = Array.isArray(given) ? given : [];
    return (q.type === 'multi' ? '<div class="hint">Pick everything that is true, then hit Next.</div>' : '') +
      q.choices.map((c, i) => `
        <label class="opt ${picked.includes(i) ? 'on' : ''}">
          <input type="${kind}" name="q" value="${i}" ${picked.includes(i) ? 'checked' : ''}>
          <span>${esc(c)}</span></label>`).join('');
  }

  if (q.type === 'photo'){
    return `<button type="button" class="photo-btn" id="shoot">Take a picture</button>
      <input type="file" accept="image/*" capture="environment" multiple id="file" style="display:none">
      <div class="thumbs" id="thumbs"></div>`;
  }

  if (q.type === 'longtext'){
    return `<textarea id="field" placeholder="Type here">${esc(given || '')}</textarea>`;
  }

  // A store-number question gets the real list when we have one.
  const looksLikeStore = /store/i.test(q.title) && /number/i.test(q.title);
  if (looksLikeStore && STORES.length){
    return `<select id="field"><option value="">Pick your store</option>` +
      STORES.map(s => `<option value="${esc(s.num)}"${given === s.num ? ' selected' : ''}>
        ${esc(s.num)}${s.name ? ' — ' + esc(s.name) : ''}</option>`).join('') + `</select>`;
  }
  return `<input type="text" id="field" ${looksLikeStore ? 'inputmode="numeric"' : ''}
    value="${esc(given || '')}" placeholder="Type here">`;
}

function wire(q){
  const stage = document.getElementById('stage');

  if (q.type === 'single' || q.type === 'multi'){
    stage.querySelectorAll('input[name="q"]').forEach(input => {
      input.addEventListener('change', () => {
        if (q.type === 'single'){
          answers[q.n] = [Number(input.value)];
          saveDraft();
          // One answer means they are done with this question: move on, after
          // a beat so they see what they picked.
          stage.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', o.querySelector('input').checked));
          setTimeout(() => { if (at < FORM.questions.length - 1) go(1); }, 320);
        } else {
          answers[q.n] = [...stage.querySelectorAll('input[name="q"]:checked')].map(i => Number(i.value));
          input.closest('.opt').classList.toggle('on', input.checked);
          saveDraft();
        }
        say('');
      });
    });
    return;
  }

  if (q.type === 'photo'){
    drawThumbs(q);
    document.getElementById('shoot').addEventListener('click', () => document.getElementById('file').click());
    document.getElementById('file').addEventListener('change', e => addPhotos(q, e.target));
    return;
  }

  const field = document.getElementById('field');
  field.addEventListener('input', () => { answers[q.n] = field.value; saveDraft(); say(''); });
  field.addEventListener('change', () => { answers[q.n] = field.value; saveDraft(); say(''); });
}

// ── Moving between questions ────────────────────────────────────────────────
function answered(q){
  if (!q) return true;
  if (q.required === false) return true;
  if (q.type === 'photo') return (photos[q.n] || []).length > 0;
  const v = answers[q.n];
  return Array.isArray(v) ? v.length > 0 : String(v || '').trim() !== '';
}

function go(by){
  if (by > 0 && at >= 0){
    const q = FORM.questions[at];
    if (!answered(q)){
      say(q.type === 'photo' ? 'Take at least one picture before you move on.'
                             : 'Answer this one before you move on.');
      return;
    }
    if (at === FORM.questions.length - 1) return submit();
  }
  const to = at + by;
  if (to < -1 || to >= FORM.questions.length) return;
  at = to;
  draw(by < 0 ? 'back' : 'next');
}

function say(message){
  const box = document.getElementById('msg');
  box.textContent = message || '';
  box.style.display = message ? 'block' : 'none';
}

document.getElementById('next').addEventListener('click', () => go(1));
document.getElementById('back').addEventListener('click', () => go(-1));

// Swipe. Horizontal only, and not while the finger is scrolling a long
// question up and down.
let x0 = null, y0 = null;
const stageEl = document.getElementById('stage');
stageEl.addEventListener('touchstart', e => {
  x0 = e.changedTouches[0].clientX; y0 = e.changedTouches[0].clientY;
}, { passive: true });
stageEl.addEventListener('touchend', e => {
  if (x0 == null) return;
  const dx = e.changedTouches[0].clientX - x0;
  const dy = e.changedTouches[0].clientY - y0;
  x0 = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  go(dx < 0 ? 1 : -1);
}, { passive: true });

// A keyboard works too, for anyone filling this in on a laptop.
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName) && e.key !== 'Enter') return;
  if (e.key === 'ArrowRight' || e.key === 'Enter') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

// ── Photos ──────────────────────────────────────────────────────────────────
//
// Shrink on the phone: longest side 1600px, JPEG 0.7. A full round of 40+
// stores at full phone resolution would fill the storage bucket.
function shrink(file){
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.width  * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          URL.revokeObjectURL(url);
          // No blob means the canvas could not read it — send the original.
          resolve(blob ? new File([blob], 'photo.jpg', { type: 'image/jpeg' }) : file);
        }, 'image/jpeg', 0.7);
      }catch(err){ URL.revokeObjectURL(url); resolve(file); }
    };
    // iPhone HEIC the browser cannot decode: upload the original instead.
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function addPhotos(q, input){
  const max = q.maxPhotos || 3;
  photos[q.n] = photos[q.n] || [];
  const btn = document.getElementById('shoot');
  btn.textContent = 'Getting the picture ready…';

  for (const file of [...input.files]){
    if (photos[q.n].length >= max) break;
    const small = await shrink(file);
    photos[q.n].push({ file: small, url: URL.createObjectURL(small) });
  }
  input.value = '';
  drawThumbs(q);
  say('');
}

function drawThumbs(q){
  const list = photos[q.n] || [];
  const max = q.maxPhotos || 3;
  document.getElementById('thumbs').innerHTML = list.map((p, i) =>
    `<div class="thumb"><img src="${p.url}" alt="">
       <button type="button" data-i="${i}" aria-label="Remove this picture">×</button></div>`).join('');

  document.querySelectorAll('.thumb button').forEach(b => b.addEventListener('click', () => {
    photos[q.n].splice(Number(b.dataset.i), 1);
    drawThumbs(q);
  }));

  const btn = document.getElementById('shoot');
  btn.textContent = list.length >= max ? `You have ${max} pictures`
                  : (list.length ? 'Take another picture' : 'Take a picture');
  btn.disabled = list.length >= max;
}

// ── Sending ─────────────────────────────────────────────────────────────────
async function submit(){
  const missing = FORM.questions.map((q, i) => answered(q) ? null : i).filter(i => i !== null);
  if (missing.length){
    at = missing[0];
    draw();
    say('This one is not finished yet.');
    return;
  }

  const next = document.getElementById('next');
  const body = new FormData();
  body.append('auditId', FORM.id);
  body.append('answers', JSON.stringify(answers));
  let count = 0;
  for (const [n, list] of Object.entries(photos)){
    for (const p of list){ body.append('photo_' + n, p.file, 'photo.jpg'); count++; }
  }

  next.disabled = true;
  next.textContent = `Sending ${count} pictures…`;
  say('');

  try{
    const res = await fetch('/api/audits/submit', { method:'POST', body });
    const data = await res.json();
    if (!res.ok){
      // Everything they typed and every picture is still here.
      next.disabled = false; next.textContent = 'Send my answers';
      if ((data.missing || []).length){
        const first = FORM.questions.findIndex(q => q.n === data.missing[0].n);
        if (first >= 0){ at = first; draw(); }
      }
      say(data.error || 'That did not send. Try again.');
      return;
    }
    clearDraft();
    showResults(data);
  }catch(err){
    next.disabled = false; next.textContent = 'Send my answers';
    say('That did not send. Your answers are still here — check your signal and hit the button again.');
  }
}

function showResults(data){
  const names = (q, list) => (list || []).map(i => q.choices[i]).join(' · ');
  const blocks = data.results.map(r => {
    const q = FORM.questions.find(x => x.n === r.n) || { choices: [], title: r.title };
    return `<div class="r ${r.correct ? '' : 'wrong'}">
      <div class="q-num">Question ${r.n}</div>
      <div class="q-title" style="font-size:17px;margin:7px 0 11px;">${esc(q.title)}</div>
      <div><span class="mark ${r.correct ? 'ok' : 'no'}">${r.correct ? '✔ You got it right' : '✘ Not quite'}</span></div>
      <div class="quiet" style="margin-top:8px">You said: ${esc(names(q, r.given) || 'nothing')}</div>
      <div style="margin-top:4px"><b>Right answer:</b> ${esc(names(q, r.correctChoices))}</div>
      <div class="why">${esc(r.explanation)}</div>
    </div>`;
  }).join('');

  document.getElementById('foot').style.display = 'none';
  say('');
  setProgress(1, 'Finished');
  const stage = document.getElementById('stage');
  stage.className = 'stage scrollable';
  stage.innerHTML = `
    <div class="score">You got <b>${data.score} out of ${data.maxScore}</b></div>
    ${blocks}
    <div class="intro"><b>Fix what you found before the audit.</b> Your manager will see your photos.</div>`;
  stage.scrollTop = 0;
}

start();
</script>
</body>
</html>
