    return (r.items || []).every((it, i) => placed[i] != null && Number(placed[i]) === Number(it.target));
  }
  if (q.type === 'hotspot'){
    // Same rule as the server: every problem found, within a thumb's width.
    const taps = Array.isArray(given) ? given : [];
    const spots = r.hotspots || [];
    const used = new Set();
    for (const h of spots){
      const hit = taps.findIndex((t, i) => !used.has(i)
        && Math.pow((t.x - h.x) / ((h.rx || 5) * 1.3), 2)
         + Math.pow((t.y - h.y) / ((h.ry || 5) * 1.3), 2) <= 1);
      if (hit < 0) return false;
      used.add(hit);
    }
    return true;
  }
  const picked = Array.isArray(given) ? given : [];
  const want = r.correctChoices || [];
  return picked.length === want.length && want.every(i => picked.includes(i));
}

function drawRetry(dir){
  const stage = document.getElementById('stage');
  const foot = document.getElementById('foot');
  const r = RETRY.list[RETRY.at];
  const q = retryQuestion();
  say('');

  stage.className = 'stage';
  const done = RETRY.shown;
  stage.innerHTML = `<div class="slide ${dir === 'back' ? 'back' : ''}">
      <div class="q-num">Second go · ${RETRY.at + 1} of ${RETRY.list.length}</div>
      <div class="q-title">${esc(q.title)}</div>
      ${q.help ? `<div class="lookfor"><b>What to look for</b>${esc(q.help)}</div>` : ''}
      ${body(q)}
      ${done ? verdictHtml(q, checked[q.n]) : ''}
    </div>`;
  if (!done) wire(q);

  foot.style.display = 'flex';
  document.getElementById('back').style.display = 'none';
  const next = document.getElementById('next');
  // Submitting left the button held down on purpose. The second go borrows
  // the same button, so it has to let go of it.
  next.disabled = false;
  next.textContent = done
    ? (RETRY.at === RETRY.list.length - 1 ? 'Finish' : 'Next')
    : 'Check my answer';
  setProgress((RETRY.at + (done ? 1 : 0)) / RETRY.list.length,
    `Second go · ${RETRY.at + 1} of ${RETRY.list.length}`);
  stage.scrollTop = 0;
}

function retryNext(){
  const r = RETRY.list[RETRY.at];
  const q = retryQuestion();

  if (!RETRY.shown){
    if (!answered(q)){ say('Have a go at this one first.'); return; }
    const right = markRetry(q, r);
    if (right) RETRY.right += 1;
    // The verdict is built from the key that came back with the results, so
    // it reads exactly like the first time round.
    checked[q.n] = { ...r, correct: right, earned: right ? r.points : 0 };
    RETRY.shown = true;
    drawRetry();
    if (right) celebrate();
    return;
  }

  RETRY.shown = false;
  if (RETRY.at === RETRY.list.length - 1) return finishRetry();
  RETRY.at += 1;
  drawRetry();
}

function finishRetry(){
  const got = RETRY.right;
  const of = RETRY.list.length;
  const data = RETRY.data;
  RETRY = null;
  const stage = document.getElementById('stage');
  document.getElementById('foot').style.display = 'none';
  setProgress(1, 'Finished');
  stage.className = 'stage scrollable';
  stage.innerHTML = `<div class="sent">✔ That is the lot.
      <span>Your score was sent earlier and has not changed — this round was practice.</span></div>
    ${coachHtml(got === of ? 'Second time around you got every one of them.'
      : got ? `You got ${got} of the ${of} you had missed. That is the bit that sticks.`
            : 'These are the ones to go over with your manager.',
      'Close the page whenever you are ready.', got === of ? 'cheer' : 'hello')}`;
  if (got === of && of > 0) celebrate();
  stage.scrollTop = 0;
}

function showResults(data){
  const names = (q, list) => (list || []).map(i => q.choices[i]).join(' · ');
  const blocks = data.results.map(r => {
    const q = FORM.questions.find(x => x.n === r.n) || { choices: [], title: r.title };
    return `<div class="r ${r.correct ? '' : 'wrong'}">
      <div class="q-num">Question ${r.n}</div>
      <div class="q-title" style="font-size:17px;margin:7px 0 11px;">${esc(q.title)}</div>
      <div><span class="mark ${r.correct ? 'ok' : 'no'}">${
        r.correct ? '✔ You got it right' : '✘ Not quite'}</span></div>
      <div class="quiet" style="margin-top:8px">You said: ${esc(names(q, r.given) || 'nothing')}</div>
      <div style="margin-top:4px"><b>Right answer:</b> ${esc(names(q, r.correctChoices))}</div>
      <div class="why">${esc(r.explanation)}</div>
    </div>`;
  }).join('');

  document.getElementById('foot').style.display = 'none';
  say('');
  setProgress(1, 'Finished');
  const stage = document.getElementById('stage');
  stage.className = 'stage scrollable';
  // Adam signs off on how it went, and means it either way.
  const share = data.maxScore ? data.score / data.maxScore : 1;
  const signOff = share >= 0.9 ? 'That is a strong walk. Nice work.'
                : share >= 0.7 ? 'Good walk. Read the ones you missed and you have got it.'
                : 'Worth another look at the ones below — that is what they are for.';

  stage.innerHTML = `
    <div class="sent">✔ Sent. Your answers and pictures are in.
      <span>Nothing else to do — you can close this page. What is below is yours to read.</span></div>
    ${IS_TEST ? `<div class="score">You got <b>${data.score} out of ${data.maxScore}</b></div>` : ''}
    ${COACH !== 'none' ? coachHtml(signOff, 'Thanks for walking it. See you on the next one.',
         hasPose('clap') ? 'clap' : (share >= 0.9 ? 'cheer' : 'hello')) : ''}
    ${blocks}
    <div class="intro"><b>Fix what you found before the audit.</b> Your manager will see your photos.</div>
    ${missedFrom(data).length ? `<div class="again"><button class="btn-big" id="goAgain">
        Go again on the ${missedFrom(data).length} I missed</button></div>` : ''}`;

  const again = document.getElementById('goAgain');
  if (again) again.addEventListener('click', () => startRetry(data));
  stage.scrollTop = 0;
  if (COACH !== 'none' && share >= 0.9) celebrate();
}

start();
</script>
</body>
</html>
