<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Readiness Check</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0049C9; --blue-dark:#003799; --red:#D91823; --green:#1CB145;
    --ink:#101828; --muted:#5a6475; --line:#dfe3ea; --bg:#f4f6fa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);overflow:hidden;
       font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       font-size:17px;line-height:1.5;}

  /* One question fills the screen: header, the question, then the buttons. */
  .app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;}

  header{background:var(--blue);color:#fff;padding:14px 16px 12px;flex:none;}
  header img{height:26px;display:block;margin-bottom:8px;}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.2px;}
  .bar{height:5px;background:rgba(255,255,255,.28);border-radius:4px;margin-top:11px;overflow:hidden;}
  .bar span{display:block;height:100%;background:#fff;width:0;transition:width .3s ease;}
  .count{font-size:12.5px;opacity:.9;margin-top:7px;}

  .stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 16px 8px;
         -webkit-overflow-scrolling:touch;touch-action:pan-y;}
  .slide{animation:in .22s ease;}
  .slide.back{animation:inBack .22s ease;}
  @keyframes in{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
  @keyframes inBack{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}

  .q-num{font-size:12.5px;font-weight:700;color:var(--blue);letter-spacing:.5px;text-transform:uppercase;}
  .q-title{margin:9px 0 18px;font-weight:600;font-size:19px;line-height:1.4;}
  /* A clip to watch before answering. It loops, because the whole point of
     one of these questions is watching it twice. */
  .clip{margin:0 0 16px;}
  .clip video{width:100%;border-radius:12px;border:1.5px solid var(--line);
              background:#000;display:block;}
  .clip .again{display:block;width:100%;margin-top:8px;padding:11px;border-radius:10px;
              border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:600;
              color:var(--blue);}

  /* What to look for, from whoever wrote the question. Sits under the
     wording, before the answers, because that is when it is useful. */
  .lookfor{margin:-8px 0 17px;padding:12px 14px;border-radius:11px;background:#eef3fe;
           border:1px solid #cddbf8;font-size:15px;line-height:1.45;color:#16325f;}
  .lookfor b{display:block;font-size:12px;letter-spacing:.4px;text-transform:uppercase;
           color:var(--blue);margin-bottom:3px;}

  /* Spot what changed: the before picture above the one they tap. */
  .before{margin:0 0 13px;}
  .before img{width:100%;border-radius:12px;border:1.5px solid var(--line);display:block;}
  .pic-label{font-size:12.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
             color:var(--muted);margin:0 0 6px;}

  /* Drawing on a photo they just took. */
  .draw-over{position:fixed;inset:0;z-index:70;background:#0d1016;display:flex;
             flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;}
  .draw-over canvas{max-width:100%;max-height:calc(100% - 84px);border-radius:10px;
             background:#fff;touch-action:none;}
  .draw-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .draw-bar button{padding:12px 17px;border-radius:11px;border:none;font:inherit;font-weight:600;
             background:#2a2f3a;color:#fff;}
  .draw-bar button.go{background:var(--blue);}
  .draw-bar .pen{width:34px;height:34px;border-radius:50%;border:2.5px solid #fff;padding:0;}
  .draw-bar .pen.on{outline:3px solid #fff;outline-offset:2px;}
  .thumb .pen-btn{position:absolute;left:4px;bottom:4px;width:26px;height:26px;border-radius:50%;
             border:none;background:rgba(16,24,40,.72);color:#fff;font-size:13px;line-height:26px;padding:0;}

  /* Going back over the ones they missed. */
  .again{margin-top:18px;}
  .again .btn-big{display:block;width:100%;padding:16px;border:none;border-radius:13px;
             background:var(--blue);color:#fff;font:inherit;font-size:17px;font-weight:650;}

  /* Number and date answers: the same box as a text answer, narrower. */
  .numrow{display:flex;align-items:center;gap:10px;}
  .numrow input{max-width:220px;}
  .numrow .unit{color:var(--muted);font-size:15.5px;}

  /* Put-it-where-it-goes. One board for sorting into buckets, matching two
     lists and dropping labels on a picture. */
  /* The tray stays put at the top while the buckets scroll under it, so the
     thing you picked up is always on screen next to where it has to go. On
     a phone the two of them do not fit together any other way. */
  .tray{position:sticky;top:-20px;z-index:5;
        display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;margin-bottom:14px;
        max-height:38vh;overflow-y:auto;
        border:1.5px dashed var(--line);border-radius:12px;background:#fff;
        box-shadow:0 6px 10px -8px rgba(16,24,40,.35);}
  .tray:empty::after{content:'Everything is placed.';color:var(--muted);font-size:14.5px;}
  .chip{display:inline-block;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;
        background:#fff;font-size:15.5px;font-weight:500;line-height:1.3;cursor:grab;
        touch-action:none;user-select:none;box-shadow:0 1px 2px rgba(16,24,40,.06);}
  .chip.held{border-color:var(--blue);background:#eef3fe;box-shadow:0 6px 16px rgba(16,24,40,.18);}
  .chip.right{border-color:var(--green);background:#eafaef;}
  .chip.wrong{border-color:var(--red);background:#fdeced;}
  .chip.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;margin:0;}

  /* Where things go, pinned so it is always reachable, and what has to be
     placed as a list of full-width rows under it. */
  .places{position:sticky;top:-20px;z-index:5;background:var(--bg);
          padding:6px 0 10px;margin-bottom:4px;}
  .places-head{font-size:13.5px;color:var(--muted);margin-bottom:8px;}
  .places-row{display:flex;gap:8px;flex-wrap:wrap;}
  /* These are the answers you are sorting into, so they look like it all the
     time rather than lighting up on cue. Only the one under the finger
     changes, because a highlight that is on everything says nothing. */
  .place{flex:1 1 140px;min-height:54px;padding:11px 13px;border-radius:12px;
         border:2px solid var(--blue);background:#fff;font:inherit;font-size:15px;
         font-weight:650;color:var(--blue);text-align:center;line-height:1.3;}
  .place.over{background:var(--blue);color:#fff;
              box-shadow:0 6px 16px rgba(16,24,40,.22);}

  .rows{display:flex;flex-direction:column;gap:8px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;
       padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;
       font-size:15.5px;line-height:1.4;cursor:pointer;touch-action:none;user-select:none;}
  .row .what{flex:1;min-width:0;}
  .row .went{flex:none;font-size:12.5px;font-weight:700;color:var(--blue);
             background:#eef3fe;border-radius:7px;padding:5px 9px;max-width:42%;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row.done{background:#fbfcfe;}
  .row.held{border-color:var(--blue);background:#eef3fe;
            box-shadow:0 6px 16px rgba(16,24,40,.14);}
  .row.right{border-color:var(--green);background:#eafaef;}
  .row.wrong{border-color:var(--red);background:#fdeced;}

  .buckets{display:flex;gap:10px;align-items:stretch;}
  .buckets.stack{flex-direction:column;}
  /* Side by side, two buckets on a phone are 160px wide and every chip wraps
     to three lines. One under the other, each one gets the full width. */
  @media (max-width:560px){ .buckets{flex-direction:column;} }
  .bucket{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;background:#fff;
          padding:11px;display:flex;flex-direction:column;gap:8px;}
  .bucket.over{border-color:var(--blue);background:#eef3fe;}
  .bucket .name{font-weight:650;font-size:15px;}
  .bucket .holds{display:flex;flex-wrap:wrap;gap:7px;min-height:44px;}

  .pic-drop{position:relative;display:block;margin-bottom:14px;}
  .pic-drop img{width:100%;border-radius:12px;border:1.5px solid var(--line);display:block;}
  .zone{position:absolute;transform:translate(-50%,-50%);min-width:42px;min-height:42px;
        border:2.5px dashed rgba(0,73,201,.85);border-radius:12px;background:rgba(255,255,255,.72);
        display:flex;align-items:center;justify-content:center;padding:4px 7px;
        font-size:13px;font-weight:600;color:var(--blue);text-align:center;}
  .zone.over{border-style:solid;background:#eef3fe;}
  .zone.filled{border-style:solid;background:#fff;color:var(--ink);}
  .zone.right{border-color:var(--green);background:#eafaef;}
  .zone.wrong{border-color:var(--red);background:#fdeced;}

  /* Slider */
  .slider{margin:4px 0 0;}
  .slider input[type=range]{width:100%;margin:0;accent-color:var(--blue);height:34px;}
  .slider .ends{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);}
  .slider .now{text-align:center;font-size:34px;font-weight:700;line-height:1.1;margin-bottom:2px;}

  /* Says where the point of no return is, before they reach it. */
  .lockline{margin:14px 0 0;font-size:14px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;}
  .lockline b{color:var(--ink);font-weight:600;}
  .hint{font-size:14.5px;color:var(--muted);margin:-10px 0 16px;}

  label.opt{display:flex;gap:13px;align-items:flex-start;padding:15px;border:1.5px solid var(--line);
            border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff;}
  label.opt:active{background:#eef2fb;}
  label.opt.on{border-color:var(--blue);background:#eef3fe;}
  label.opt input{width:23px;height:23px;margin:0;flex:none;accent-color:var(--blue);}
  /* Once a question is marked the answers stop being touchable, so nobody can
     see the right one and then switch to it. */
  label.opt.locked{cursor:default;opacity:.95;}
  label.opt.right{border-color:var(--green);background:#eafaef;}
  label.opt.wrong{border-color:var(--red);background:#fdeced;}
  label.opt .tick{margin-left:auto;font-weight:700;flex:none;}
  label.opt.right .tick{color:var(--green);}
  label.opt.wrong .tick{color:var(--red);}

  input[type=text],select,textarea{width:100%;padding:15px;font:inherit;border:1.5px solid var(--line);
            border-radius:12px;background:#fff;color:var(--ink);}
  textarea{min-height:150px;resize:vertical;}

  /* Store picker: type the number, or tap it out of the list. */
  .store-list{margin-top:10px;max-height:290px;overflow-y:auto;border:1px solid var(--line);
              border-radius:12px;background:#fff;}
  .store-list button{display:block;width:100%;text-align:left;padding:14px 15px;border:none;
              border-bottom:1px solid var(--line);background:#fff;font:inherit;cursor:pointer;}
  .store-list button:last-child{border-bottom:none;}
  .store-list button:active{background:#eef3fe;}
  .store-list b{font-variant-numeric:tabular-nums;}
  .store-list .none{padding:14px 15px;color:var(--muted);font-size:15px;}

  /* Put-in-order question: tap the steps in the order they happen. */
  .step{display:flex;align-items:center;gap:11px;padding:14px 13px;border:1.5px solid var(--line);
        border-radius:12px;margin-bottom:10px;background:#fff;font-weight:500;}
  /* The handle is the only part that drags, so the list still scrolls under
     a finger that is not on a handle. */
  .grip{flex:none;width:34px;align-self:stretch;display:flex;align-items:center;justify-content:center;
        color:#9aa4b4;font-size:19px;line-height:1;cursor:grab;touch-action:none;}
  .grip:active{cursor:grabbing;}
  .step.lifted{border-color:var(--blue);background:#eef3fe;
        box-shadow:0 8px 20px rgba(16,24,40,.18);}
  .step.lifted .grip{color:var(--blue);}
  .step .pos{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);
        color:var(--muted);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .step.placed{border-color:var(--blue);background:#eef3fe;}
  .step.placed .pos{background:var(--blue);border-color:var(--blue);color:#fff;}
  .step.right{border-color:var(--green);background:#eafaef;}
  .step.right .pos{background:var(--green);border-color:var(--green);color:#fff;}
  .step.wrong{border-color:var(--red);background:#fdeced;}
  .step.wrong .pos{background:var(--red);border-color:var(--red);color:#fff;}
  .step .should{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right;}
  .orderctl{margin-top:4px;}

  /* Tap-the-picture question. Everything is positioned in percentages of the
     picture, so it lines up at any screen size. */
  /* The frame clips; .pan holds the picture and the marks together, so a
     mark stays on the thing it was put on at any zoom. touch-action none
     because the pinch and drag are handled here, not by the page. */
  .shot{position:relative;border-radius:13px;overflow:hidden;border:1.5px solid var(--line);
        background:#0b0d10;line-height:0;touch-action:none;user-select:none;}
  .pan{transform-origin:0 0;}
  .shot img{width:100%;display:block;pointer-events:none;}
  .layer{position:absolute;inset:0;}
  /* Counter-scaled so a mark is the same size on screen however far in you
     are; without it a mark at 3x covers a third of the picture. */
  .tap{position:absolute;width:32px;height:32px;border-radius:50%;
       transform:translate(-50%,-50%) scale(var(--inv,1));
       border:3px solid var(--blue);background:rgba(0,73,201,.22);cursor:pointer;}
  .tap b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         color:var(--blue);font-size:13px;font-weight:700;line-height:1;}
  .spot{position:absolute;border:3px solid;border-radius:50%;pointer-events:none;}
  .zoomctl{display:flex;align-items:center;gap:8px;margin-top:11px;}
  .zoomctl button{width:46px;height:40px;font:inherit;font-size:19px;font-weight:700;
       border:1.5px solid var(--line);background:#fff;color:var(--blue);border-radius:11px;cursor:pointer;}
  .zoomctl button:disabled{color:var(--muted);background:#f4f6fa;}
  .zoomctl .lvl{font-size:14.5px;color:var(--muted);font-weight:600;min-width:42px;text-align:center;}
  .zoomctl .reset{width:auto;padding:0 14px;font-size:15px;}
  .spot.found{border-color:var(--green);background:rgba(28,177,69,.14);}
  .spot.missed{border-color:var(--red);background:rgba(217,24,35,.14);}
  .spot i{position:absolute;top:-11px;left:-11px;width:24px;height:24px;border-radius:50%;
          color:#fff;font-style:normal;font-size:13px;font-weight:700;line-height:24px;text-align:center;}
  .spot.found i{background:var(--green);}
  .spot.missed i{background:var(--red);}
  .tapcount{margin-top:11px;font-size:15px;color:var(--muted);font-weight:600;}
  .findings{margin-top:14px;}
  .finding{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--line);}
  .finding .no{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-size:13px;
               font-weight:700;line-height:24px;text-align:center;}
  .finding.found .no{background:var(--green);}
  .finding.missed .no{background:var(--red);}
  .finding .what{font-weight:600;}
  .finding .why{font-size:15px;color:var(--muted);margin-top:4px;line-height:1.45;}
  .photo-btn{display:block;width:100%;padding:18px;border:2px dashed var(--blue);border-radius:13px;
             background:#eef3fe;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;text-align:center;}
  .photo-btn:disabled{border-color:var(--line);background:#fff;color:var(--muted);}
  .thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .thumb{position:relative;width:92px;height:92px;border-radius:11px;overflow:hidden;border:1px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb button{position:absolute;top:3px;right:3px;width:27px;height:27px;border:none;border-radius:50%;
                background:rgba(16,24,40,.78);color:#fff;font-size:15px;line-height:1;cursor:pointer;}

  /* The verdict, right under the question they just answered. */
  .verdict{border-radius:13px;padding:15px;margin-top:16px;border:1.5px solid;}
  .verdict.ok{border-color:var(--green);background:#eafaef;}
  .verdict.no{border-color:var(--red);background:#fdeced;}
  .verdict .head{font-weight:700;font-size:17px;}
  .verdict.ok .head{color:#13803a;}
  .verdict.no .head{color:#a5121b;}
  .verdict .answer{margin-top:9px;font-weight:600;}
  .verdict .why{margin-top:9px;font-size:15.5px;line-height:1.5;}

  /* ── Adam ───────────────────────────────────────────────────────────────
     The guide for every walk. He opens the audit, cheers a right answer and
     turns up with the explanation when one is wrong. One picture; the mood
     comes from what he says and how he moves. */
  .coach{display:flex;gap:10px;align-items:flex-start;margin:0 0 18px;}
  .verdict .coach{margin:13px 0 0;}
  /* A fixed box, not width:auto. The frames of a pose are not all the same
     shape — arms up is half as wide again as arms down — so an image sized
     to its own content resized the row every time it swapped, and the whole
     page shuffled along with it. She is drawn inside the box instead, which
     leaves the layout alone while she moves. */
  .adam{flex:none;width:124px;height:150px;display:block;object-fit:contain;
        object-position:50% 100%;transform-origin:50% 100%;
        filter:drop-shadow(0 3px 5px rgba(16,24,40,.16));
        animation:adamIn .34s cubic-bezier(.2,1.5,.5,1) both;}
  .coach.cheer .adam{animation:adamIn .34s cubic-bezier(.2,1.5,.5,1) both,
                               adamCheer .62s .3s ease-in-out 2;}
  .bubble{position:relative;flex:1;min-width:0;background:#fff;border:1.5px solid var(--line);
          border-radius:14px;padding:12px 15px;font-size:15.5px;line-height:1.5;
          box-shadow:0 2px 7px rgba(16,24,40,.06);}
  .bubble::before{content:'';position:absolute;left:-8px;top:26px;width:14px;height:14px;background:#fff;
          border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg);}
  .bubble .who{display:block;font-weight:700;font-size:13px;color:var(--blue);
          letter-spacing:.3px;margin-bottom:2px;}
  .bubble .line{font-weight:600;}
  .bubble .why{margin-top:7px;color:var(--muted);font-size:15px;}
  .verdict.ok .bubble,.verdict.ok .bubble::before{border-color:var(--green);}
  .verdict.no .bubble,.verdict.no .bubble::before{border-color:var(--red);}
  @keyframes adamIn{from{opacity:0;transform:scale(.4) rotate(-14deg);}to{opacity:1;transform:none;}}
  @keyframes adamCheer{0%,100%{transform:none;}
                       25%{transform:translateY(-10px) rotate(-8deg);}
                       50%{transform:translateY(0) rotate(0);}
                       75%{transform:translateY(-6px) rotate(7deg);}}

  /* Thrown over everything for a second when they get one right. */
  .confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:40;}
  .confetti i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;
              animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(106vh) rotate(760deg);}}

  /* On a phone his head and the bubble padding were squeezing the
     explanation into a column about four words wide. */
  @media (max-width:430px){
    .coach{gap:7px;}
    /* Narrower on a phone, so the explanation keeps its line length. */
    .adam{width:96px;height:112px;}
    .bubble{padding:11px 12px;}
  }

  @media (prefers-reduced-motion: reduce){
    .adam,.coach.cheer .adam{animation:none;}
  }

  .foot{flex:none;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
        background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;}
  button.go{flex:1;padding:17px;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--blue);
            border:none;border-radius:13px;cursor:pointer;}
  button.go:disabled{background:#92a6c9;}
  button.back{padding:17px 18px;font:inherit;font-weight:600;color:var(--blue);background:#fff;
              border:1.5px solid var(--line);border-radius:13px;cursor:pointer;}
  .msg{color:var(--red);font-weight:600;font-size:14.5px;padding:0 16px 10px;background:#fff;}
  /* Waiting for signal is not an error and should not look like one. */
  .msg.calm{color:var(--ink);font-weight:500;}
  .msg.calm b{color:var(--blue);}

  /* Intro and results scroll normally. */
  .scrollable{overflow-y:auto;padding:20px 16px 30px;}
  .intro{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:16px;}
  .sent{background:#eafaef;border:1.5px solid var(--green);color:#13803a;border-radius:14px;
        padding:16px;margin-bottom:16px;font-weight:700;font-size:17px;}
  .sent span{display:block;margin-top:6px;font-weight:400;font-size:15px;color:#2c6b43;}
  .score{background:var(--blue);color:#fff;border-radius:16px;padding:24px;text-align:center;margin-bottom:18px;}
  .score b{display:block;font-size:42px;line-height:1.1;}
  .r{background:#fff;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:12px;padding:15px;margin-bottom:12px;}
  .r.wrong{border-left-color:var(--red);}
  .mark{font-weight:700;}
  .mark.ok{color:var(--green);} .mark.no{color:var(--red);}
  .why{background:#f4f6fa;border-radius:9px;padding:12px;margin-top:11px;font-size:15.5px;}
  .quiet{color:var(--muted);font-size:14.5px;}
</style>
</head>
<body>

<div class="app">
  <header>
    <img src="/images/logo-wordmark.png" alt="Ayvaz Pizza" onerror="this.style.display='none'">
    <h1 id="title">Readiness Check</h1>
    <div class="bar"><span id="progress"></span></div>
    <div class="count" id="count"></div>
  </header>

  <div class="stage" id="stage"><div class="intro">Loading…</div></div>
  <div class="msg" id="msg" style="display:none"></div>
  <div class="foot" id="foot" style="display:none">
    <button class="back" id="back" type="button">Back</button>
    <button class="go" id="next" type="button">Next</button>
  </div>
</div>

<script>
const AUDIT_ID = new URLSearchParams(location.search).get('id') || 'steritech-readiness';
const DRAFT_KEY = 'audit-draft-' + AUDIT_ID;
const WALK_KEY  = 'audit-walk-' + AUDIT_ID;

// One id for this walk, kept so a reload carries on the same walk instead of
// starting a clean one. The server writes each answer down against it the
// first time it is given, and grades that — not what this page sends at the
// end. Coming back to a question after seeing the verdict changes nothing.
const WALK_ID = (() => {
  try {
    const kept = localStorage.getItem(WALK_KEY);
    if (kept) return kept;
  } catch (e) {}
  const made = (crypto.randomUUID ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      }));
  try { localStorage.setItem(WALK_KEY, made); } catch (e) {}
  return made;
})();

let FORM = null;
let STORES = [];
let at = -1;                 // -1 is the intro screen
const answers = {};          // { n: string | number[] }
const photos  = {};          // { n: [{file, url}] }
const checked = {};          // { n: verdict } — a marked question is locked

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Scored (so it gets marked and locked) is a different question from
// answered-by-picking-a-choice (so it renders as a list of options).
const isChoice = q => q.type === 'single' || q.type === 'multi';
// Scored means it gets marked and locked. A question worth nothing is just
// recorded — no Check, no verdict, straight on to the next one.
const isGraded = q => (isChoice(q) || q.type === 'hotspot' || q.type === 'order'
                       || q.type === 'assign') && q.points > 0;

// ── Adam ────────────────────────────────────────────────────────────────────
// He says the same kind of thing every time, in different words, so twenty
// questions do not read like twenty copies of one sentence. The line is picked
// off the question number, not at random, so it does not change under them
// when the screen redraws.
const ADAM_YES  = ['Nailed it.', 'That is the one.', 'Dead right.', 'Spot on.',
                   'You know your stuff.', 'Textbook.'];
// Kept for the put-it-where-it-goes and picture questions, where "you found
// three of five" is worth saying even though the question itself is wrong.
const ADAM_PART = ['So close. One short is still a miss.',
                   'Nearly — but it has to be all of them.',
                   'Most of it, which is not the same as it.'];
const ADAM_NO   = ['Not quite. Here is why.', 'Miss — and this one is worth knowing.',
                   'Not this time. Read this bit.', 'Nope. This is the one people get caught on.'];
const adamSay = (lines, n) => lines[Math.abs(Number(n) || 0) % lines.length];

// Adam belongs on tests, not on audits. A test is worth points and tells you
// how you did; an audit records what was there, and a mascot cheering over a
// photo of a cheese pizza helps nobody. Nothing to set per audit — scoring
// the questions is what makes it a test.
let IS_TEST = false;
// Which guide, and their name, because the bubble is signed.
let COACH = 'none';
const COACH_NAMES = { adam: 'Adam', krystina: 'Krystina', pepper: 'Pepper' };

// A guide can have more than one drawing of a pose, and then it plays: the
// frames are swapped on a timer, which is all a GIF ever was. A pose with no
// entry here is a single drawing and simply sits there.
// Frames per pose. A guide with looks counts them per look, because the two
// sets of her were not drawn to the same depth: hair down has two waves,
// hair up has one.
const COACH_FRAMES = {
  pepper: { down: { hello: 2, cheer: 2, clap: 2 }, up: { cheer: 2, clap: 2 } },
};

// Some guides have more than one look. The walk picks one and keeps it, so
// she does not change her hair between questions — but a different walk gets
// a different one, which is why there are two sets of her.
const COACH_LOOKS = { pepper: ['down', 'up'] };
let LOOK = '';

function pickLook(coach){
  const looks = COACH_LOOKS[coach];
  if (!looks || !looks.length) return '';
  let n = 0;
  for (const ch of String(WALK_ID)) n = (n * 31 + ch.charCodeAt(0)) >>> 0;
  return looks[n % looks.length];
}

// Where a guide's drawings live: the look is part of the name when there is
// one, so Adam and Krystina keep the plain /images/adam-cheer.webp.
function coachFile(coach, pose, frame){
  const stem = `/images/${coach}${LOOK ? '-' + LOOK : ''}-${pose}`;
  return frame ? `${stem}-${frame}.webp` : `${stem}.webp`;
}
const FRAME_MS = 420;
let framePlayer = null;

const COACH_POSES = {
  adam: ['hello', 'cheer', 'explain'],
  krystina: ['hello', 'cheer', 'explain'],
  pepper: ['hello', 'cheer', 'explain', 'thumbsup', 'clap'],
};
const hasPose = pose => (COACH_POSES[COACH] || []).includes(pose);

function framesFor(coach, pose){
  const set = COACH_FRAMES[coach] || {};
  const byLook = LOOK && set[LOOK] ? set[LOOK] : set;
  return byLook[pose] || 1;
}

// One timer for the page. It walks whatever guide images are on screen, so
// nothing has to be torn down when the question changes.
function playFrames(){
  if (framePlayer) return;
  framePlayer = setInterval(() => {
    for (const img of document.querySelectorAll('.adam[data-frames]')){
      const count = Number(img.dataset.frames);
      if (!(count > 1)) continue;
      const next = ((Number(img.dataset.frame) || 1) % count) + 1;
      img.dataset.frame = next;
      img.src = coachFile(img.dataset.coach, img.dataset.pose, next);
    }
  }, FRAME_MS);
}

// The second frame has to be in the browser before it is shown, or the first
// loop blinks.
function preloadFrames(coach, pose){
  const count = framesFor(coach, pose);
  for (let i = 2; i <= count; i++) new Image().src = coachFile(coach, pose, i);
}

// pose: 'hello' to open the walk, 'cheer' for a right answer, 'explain' for
// everything else. Cheer is the only one that moves.
// A picture that will not load gets one more go — a dropped request or a
// 404 cached from before that guide's drawings shipped is the usual reason,
// and both clear on a retry. If it still will not come, the guide carries on
// without a picture.
//
// It used to fall back to Adam's drawing, which was worse than no picture at
// all: the bubble said Pepper and the face was his, on whichever machine had
// the bad cache. Nobody can debug that from the shop floor.
function guideImageFailed(img){
  if (!img.dataset.retried){
    img.dataset.retried = '1';
    img.src = img.src.split('?')[0] + '?v=' + Date.now();
    return;
  }
  img.onerror = null;
  img.removeAttribute('data-frames');
  img.style.display = 'none';
}

function coachHtml(line, why, pose){
  if (COACH === 'none') return '';
  const which = pose || 'explain';
  const name = COACH_NAMES[COACH] || 'Adam';
  const count = framesFor(COACH, which);
  // A guide with frames numbers its files; one without keeps the plain name.
  const src = coachFile(COACH, which, count > 1 ? 1 : 0);
  if (count > 1){ preloadFrames(COACH, which); playFrames(); }
  return `<div class="coach ${which === 'cheer' ? 'cheer' : ''}">
    <img class="adam" src="${src}" alt="${esc(name)}"
         data-coach="${COACH}" data-pose="${which}" data-frames="${count}" data-frame="1"
         onerror="guideImageFailed(this)">
    <div class="bubble"><span class="who">${esc(name)}</span>
      <div class="line">${esc(line)}</div>
      ${[].concat(why || []).filter(Boolean)
         .map(part => `<div class="why">${esc(part)}</div>`).join('')}
    </div></div>`;
}

// What Adam says about a marked question, and the explanation under it.
function coachVerdict(v, n){
  // "Nearly" now means they got most of it and still scored nothing, which is
  // the thing worth saying out loud on an all-or-nothing question.
  const nearly = !v.correct && v.right > 0 && v.of > v.right;
  const line = v.correct ? adamSay(ADAM_YES, n)
             : nearly ? adamSay(ADAM_PART, n)
             : adamSay(ADAM_NO, n);
  const pose = v.correct ? 'cheer' : nearly ? 'thumbsup' : 'explain';
  return coachHtml(line, v.explanation, hasPose(pose) ? pose : (v.correct ? 'cheer' : 'explain'));
}

function celebrate(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div');
  box.className = 'confetti';
  const colours = ['#0049C9', '#1CB145', '#FFC400', '#D91823', '#7B3FE4', '#00B5D8'];
  for (let i = 0; i < 26; i++){
    const bit = document.createElement('i');
    bit.style.left = (Math.random() * 100) + 'vw';
    bit.style.background = colours[i % colours.length];
    bit.style.animationDuration = (1.1 + Math.random() * 0.9) + 's';
    bit.style.animationDelay = (Math.random() * 0.35) + 's';
    box.appendChild(bit);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2800);
}

// Draft save/restore. Pictures cannot be saved, so only answers come back.
function saveDraft(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(answers)); }catch(e){} }
function loadDraft(){ try{ return JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); }catch(e){ return {}; } }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); localStorage.removeItem(WALK_KEY); }catch(e){} }

async function start(){
  const res = await fetch('/api/audits/form?id=' + encodeURIComponent(AUDIT_ID));
  if (!res.ok){
    document.getElementById('stage').innerHTML =
      '<div class="intro">This walk is not available. Ask your manager for a new link.</div>';
    return;
  }
  FORM = await res.json();
  IS_TEST = FORM.kind ? FORM.kind === 'test' : FORM.questions.some(q => Number(q.points) > 0);
  COACH = COACH_NAMES[FORM.coach] ? FORM.coach : (IS_TEST && !FORM.coach ? 'adam' : 'none');
  LOOK = pickLook(COACH);
  STORES = await fetch('/api/audits/stores').then(r => r.json()).catch(() => []);
  document.getElementById('title').textContent = FORM.title;
  // A draft only brings back questions that were never marked; a marked one
  // is finished and should not reopen.
  Object.assign(answers, loadDraft());
  draw();
}

// ── The screens ─────────────────────────────────────────────────────────────
function draw(dir){
  const stage = document.getElementById('stage');
  const foot  = document.getElementById('foot');
  say('');

  if (at < 0){
    stage.className = 'stage scrollable';
    const hello = COACH_NAMES[COACH]
      ? `Hi, I'm ${COACH_NAMES[COACH]}. I'll walk you through this one.` : '';
    stage.innerHTML = COACH !== 'none'
      ? coachHtml(hello, [
          FORM.description,
          `${FORM.questions.length} questions, one at a time. Check your answer and I'll `
          + `tell you straight away how you did and why. Take your time.`,
        ], 'hello')
      : `<div class="intro quiet">${FORM.questions.length} questions, one at a time.</div>`
        + `<div class="intro">${esc(FORM.description)}</div>`;
    foot.style.display = 'flex';
    document.getElementById('back').style.display = 'none';
    document.getElementById('next').textContent = 'Start';
    setProgress(0, '');
    return;
  }

  const q = FORM.questions[at];
  const verdict = checked[q.n];

  stage.className = 'stage';
  stage.innerHTML = `<div class="slide ${dir === 'back' ? 'back' : ''}">
      <div class="q-num">Question ${at + 1}${q.points ? ' · ' + q.points + (q.points > 1 ? ' points' : ' point') : ''}</div>
      <div class="q-title">${esc(q.title)}</div>
      ${q.help ? `<div class="lookfor"><b>What to look for</b>${esc(q.help)}</div>` : ''}
      ${clipHtml(q)}
      ${body(q)}
      ${isGraded(q) && !verdict ? `<div class="lockline">✎️
        <span>Change your answer as many times as you like. <b>Checking it locks it in.</b></span></div>` : ''}
      ${verdictHtml(q, verdict)}
    </div>`;

  wire(q);
  foot.style.display = 'flex';
  document.getElementById('back').style.display = at === 0 ? 'none' : 'block';
  document.getElementById('next').textContent = nextLabel(q);
  setProgress((at + 1) / FORM.questions.length, `Question ${at + 1} of ${FORM.questions.length}`);
  stage.scrollTop = 0;
}

function nextLabel(q){
  // A scored question is marked before it is left, so the button says so.
  if (isGraded(q) && !checked[q.n]) return 'Check my answer';
  return at === FORM.questions.length - 1 ? 'Send my answers' : 'Next';
}

function setProgress(fraction, label){
  document.getElementById('progress').style.width = Math.round(fraction * 100) + '%';
  document.getElementById('count').textContent = label;
}

function verdictHtml(q, v){
  if (!v) return '';
  if (v.offline) return `<div class="verdict no"><div class="head">Could not check that one</div>
    <div class="why">No signal. Your answer is saved — keep going.</div></div>`;



  if (q.type === 'order'){
    const steps = q.steps || [];
    const inPlace = (v.given || []).filter((was, i) => was === i).length;
    return `<div class="verdict ${v.correct ? 'ok' : 'no'}">
      <div class="head">${v.correct ? '\u2714 That is the order' : '\u2718 ' + inPlace + ' of ' + steps.length + ' in the right place'}</div>
      ${v.correct ? '' : '<div class="answer">The right order is numbered above.</div>'}
      ${coachVerdict(v, q.n)}</div>`;
  }

  if (q.type === 'assign'){
    const names = v.targets || [];
    const rows = (v.items || []).map(it => {
      const right = it.put === it.target;
      return `<div class="finding ${right ? 'found' : 'missed'}">
        <span class="no">${right ? '✔' : '✘'}</span>
        <div><div class="what">${esc(it.text)}</div>
          <div class="why">${right
            ? esc(names[it.target] || '')
            : (it.put == null ? 'Left out. It belongs in ' : 'You put it in ' +
                esc(names[it.put] || '') + '. It belongs in ') + esc(names[it.target] || '')}</div>
        </div></div>`;
    }).join('');

    return `<div class="verdict ${v.correct ? 'ok' : 'no'}">
      <div class="head">${v.correct
        ? '✔ All ' + v.of + ' in the right place'
        : '✘ ' + v.right + ' of ' + v.of + ' in the right place'}</div>
      ${coachVerdict(v, q.n)}</div>
      <div class="findings">${rows}</div>`;
  }

  if (q.type === 'hotspot'){
    const list = (v.hotspots || []).map((h, i) => {
      const got = (v.found || []).includes(i);
      return `<div class="finding ${got ? 'found' : 'missed'}">
        <span class="no">${i + 1}</span>
        <div><div class="what">${got ? '' : 'Missed: '}${esc(h.label)}</div>
          <div class="why">${esc(h.why)}</div></div></div>`;
    }).join('');

    const got = (v.found || []).length;
    const all = (v.hotspots || []).length;
    return `<div class="verdict ${v.correct ? 'ok' : 'no'}">
      <div class="head">${v.correct ? '✔ You found all ' + all : '✘ You found ' + got + ' of ' + all}</div>
      ${v.correct ? '' : '<div class="answer">The ones circled in red are what you walked past.</div>'}
      ${coachVerdict(v, q.n)}</div>
      <div class="findings">${list}</div>`;
  }

  const right = (v.correctChoices || []).map(i => q.choices[i]).join(' · ');
  return `<div class="verdict ${v.correct ? 'ok' : 'no'}">
    <div class="head">${v.correct ? '✔ Right' : '✘ Not quite'}</div>
    ${v.correct ? '' : `<div class="answer">Right answer: ${esc(right)}</div>`}
    ${coachVerdict(v, q.n)}</div>`;
}

// Watch it as many times as they like: the answer is in the detail, and
// making somebody guess from one viewing tests their memory, not their
// knowledge. Not autoplayed — a video that starts talking in a kitchen is
// its own problem.
function clipHtml(q){
  if (!q.video) return '';
  return `<div class="clip">
    <video id="clip" src="${esc(q.video)}" controls playsinline preload="metadata"></video>
    <button type="button" class="again" id="clipAgain">Watch it again</button>
  </div>`;
}

function body(q){
  const given = answers[q.n];
  const v = checked[q.n];

  if (q.type === 'number'){
    const unit = q.unit ? `<span class="unit">${esc(q.unit)}</span>` : '';
    const lo = q.min == null ? '' : ` min="${q.min}"`;
    const hi = q.max == null ? '' : ` max="${q.max}"`;
    return `<div class="numrow"><input type="number" id="num" inputmode="decimal"${lo}${hi}
      value="${given == null ? '' : esc(given)}" placeholder="Number">${unit}</div>`;
  }

  if (q.type === 'datetime'){
    return `<input type="datetime-local" id="when" value="${esc(given || '')}">`;
  }

  if (q.type === 'assign'){
    const items = q.items || [];
    const targets = q.targets || [];
    const placed = Array.isArray(answers[q.n]) ? answers[q.n] : [];
    answers[q.n] = placed;

    const chip = it => {
      const mark = !v ? '' : (placed[it.i] === (v.items[it.i] || {}).target ? ' right' : ' wrong');
      return `<span class="chip${mark}" data-i="${it.i}">${esc(it.text)}</span>`;
    };
    const inTray = items.filter(it => placed[it.i] == null);
    const held = t => items.filter(it => placed[it.i] === t.i).map(chip).join('');

    const tray = `<div class="tray" id="tray">${inTray.map(chip).join('')}</div>`;

    if (q.layout === 'picture'){
      return `<div class="pic-drop" id="board">
          <img src="${esc(q.image)}" alt="">
          ${targets.map(t => {
            const mine = items.filter(it => placed[it.i] === t.i);
            return `<span class="zone ${mine.length ? 'filled' : ''}" data-t="${t.i}"
                      style="left:${t.x}%;top:${t.y}%;">${
              mine.length ? esc(mine.map(x => x.text).join(', ')) : '&nbsp;'}</span>`;
          }).join('')}
        </div>
        ${tray}
        <div class="hint">Tap a label, then tap where it goes. Drag works too.</div>`;
    }

    // The things to place are sentences, not words, so they get a row each
    // and the places to put them sit pinned at the top. A tray of wrapping
    // chips with the buckets below worked for "Raw / Ready to eat" and fell
    // apart the moment somebody wrote a real sentence: the item you picked
    // up scrolled out of sight before you reached where it goes.
    const done = items.filter(it => placed[it.i] != null).length;

    return `<div class="places" id="board">
        <div class="places-head">${done} of ${items.length} placed${
          done < items.length ? ' · tap a line, then tap where it goes' : ''}</div>
        <div class="places-row">
          ${targets.map(t => `<button type="button" class="place" data-t="${t.i}">
              ${esc(t.label)}</button>`).join('')}
        </div>
      </div>
      <div class="rows" id="tray">
        ${items.map(it => {
          const at = placed[it.i];
          const mark = !v ? '' : (at === (v.items[it.i] || {}).target ? ' right' : ' wrong');
          const target = at == null ? null : targets.find(t => t.i === at);
          return `<div class="row chip${mark} ${at == null ? '' : 'done'}" data-i="${it.i}">
            <div class="what">${esc(it.text)}</div>
            ${target ? `<div class="went">${esc(target.label)}</div>` : ''}
          </div>`;
        }).join('')}
      </div>
      <div class="hint">Tap one again to take it back.</div>`;
  }

  if (q.type === 'scale'){
    const lo = Number(q.min ?? 1), hi = Number(q.max ?? 10), step = Number(q.step || 1);
    // Starts in the middle rather than at one end, so a slider nobody moves
    // does not quietly read as the lowest score.
    const at = Number.isFinite(Number(given)) ? Number(given) : Math.round((lo + hi) / 2);
    answers[q.n] = at;
    return `<div class="slider">
      <div class="now" id="scaleNow">${at}</div>
      <input type="range" id="scale" min="${lo}" max="${hi}" step="${step}" value="${at}">
      <div class="ends"><span>${esc(q.minLabel || lo)}</span><span>${esc(q.maxLabel || hi)}</span></div>
    </div>`;
  }

  if (isChoice(q)){
    const kind = q.type === 'multi' ? 'checkbox' : 'radio';
    const picked = Array.isArray(given) ? given : [];
    const hint = v ? ''
      : q.type === 'multi'
        ? '<div class="hint">Pick everything that is true, then check your answer.</div>'
        : '<div class="hint">Pick your answer, then check it.</div>';
    return hint +
      q.choices.map((c, i) => {
        let state = picked.includes(i) ? 'on' : '';
        if (v && !v.offline){
          const isRight = (v.correctChoices || []).includes(i);
          if (isRight) state = 'right';
          else if (picked.includes(i)) state = 'wrong';
          else state = '';
        }
        const tick = v && !v.offline
          ? ((v.correctChoices || []).includes(i) ? '<span class="tick">✔</span>'
             : (picked.includes(i) ? '<span class="tick">✘</span>' : ''))
          : '';
        return `<label class="opt ${state} ${v ? 'locked' : ''}">
          <input type="${kind}" name="q" value="${i}" ${picked.includes(i) ? 'checked' : ''}
            ${v ? 'disabled' : ''}>
          <span>${esc(c)}</span>${tick}</label>`;
      }).join('');
  }

  if (q.type === 'order'){
    const placed = Array.isArray(given) ? given : [];
    const v = checked[q.n];
    const steps = q.steps || [];

    if (v && !v.offline){
      // Their order, top to bottom, each one told whether it belongs there.
      return placed.map((was, i) => {
        const right = was === i;
        const step = steps.find(x => x.was === was);
        return `<div class="step ${right ? 'right' : 'wrong'}">
          <span class="pos">${i + 1}</span>
          <span>${esc(step ? step.text : '')}</span>
          ${right ? '' : `<span class="should">goes at ${was + 1}</span>`}
        </div>`;
      }).join('');
    }

    // They arrange the whole list, so it always holds every step. The order
    // it arrives in is the shuffled one, and that counts as their answer
    // until they move something.
    const arrangement = (placed.length === steps.length) ? placed : steps.map(x => x.was);
    answers[q.n] = arrangement;

    return `<div id="droplist">` + arrangement.map((was, i) => {
      const step = steps.find(x => x.was === was);
      return `<div class="step" data-was="${was}">
        <span class="grip" aria-label="Drag to move">\u22ee\u22ee</span>
        <span class="pos">${i + 1}</span>
        <span>${esc(step ? step.text : '')}</span></div>`;
    }).join('') + `</div>
    <div class="orderctl"><div class="hint" style="margin:8px 0 0;">Drag the handles to put them in the order they happen, first at the top.</div></div>`;
  }

  if (q.type === 'hotspot'){
    const taps = Array.isArray(given) ? given : [];
    const v = checked[q.n];

    // Before it is marked: their own taps. After: the real problems, green
    // for the ones they found and red for the ones they walked past.
    const layer = v && !v.offline
      ? (v.hotspots || []).map((h, i) => {
          const got = (v.found || []).includes(i);
          return `<div class="spot ${got ? 'found' : 'missed'}" style="left:${h.x - h.rx}%;top:${h.y - h.ry}%;width:${h.rx * 2}%;height:${h.ry * 2}%;"><i>${i + 1}</i></div>`;
        }).join('')
      : taps.map((t, i) => `<div class="tap" data-i="${i}" style="left:${t.x}%;top:${t.y}%;"><b>${i + 1}</b></div>`).join('');

    const count = v
      ? ''
      : `<div class="tapcount" id="tapcount">${taps.length} of ${q.maxTaps} taps used · ${q.toFind} problems to find</div>
         <div class="hint" style="margin:8px 0 0;">Pinch or use + to zoom in, drag to move around. Tap a mark again to take it back.</div>`;

    const zoom = v ? '' : `<div class="zoomctl">
        <button type="button" data-zoom="out" aria-label="Zoom out">&minus;</button>
        <span class="lvl" id="zoomlvl">1.0&times;</span>
        <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
        <button type="button" class="reset" data-zoom="reset">Fit</button>
      </div>`;

    const before = q.beforeImage
      ? `<div class="before"><div class="pic-label">Before</div>
           <img src="${esc(q.beforeImage)}" alt="Before"></div>
         <div class="pic-label">Now — tap what changed</div>`
      : '';

    return before + `<div class="shot" id="shot">
        <div class="pan" id="pan">
          <img src="${esc(q.image)}" id="shotimg" alt="A kitchen to look over">
          <div class="layer" id="layer">${layer}</div>
        </div>
      </div>${zoom}${count}`;
  }

  if (q.type === 'photo'){
    return `<button type="button" class="photo-btn" id="shoot">Take a picture</button>
      <input type="file" accept="image/*" capture="environment" multiple id="file" style="display:none">
      <div class="thumbs" id="thumbs"></div>`;
  }

  if (q.type === 'longtext'){
    return `<textarea id="field" placeholder="Type here">${esc(given || '')}</textarea>`;
  }

  // Store number: type it, or tap it out of the list. Typing is faster when
  // you know your own number, which every shift leader does.
  if (looksLikeStore(q) && STORES.length){
    return `<input type="text" id="field" inputmode="numeric" autocomplete="off"
        value="${esc(given || '')}" placeholder="Type your store number">
      <div class="store-list" id="storeList"></div>`;
  }
  return `<input type="text" id="field" value="${esc(given || '')}" placeholder="Type here">`;
}

function looksLikeStore(q){ return /store/i.test(q.title) && /number/i.test(q.title); }

function wire(q){
  const again = document.getElementById('clipAgain');
  if (again) again.addEventListener('click', () => {
    const v = document.getElementById('clip');
    if (!v) return;
    v.currentTime = 0;
    v.play();
  });

  const stage = document.getElementById('stage');

  if (isChoice(q)){
    if (checked[q.n]) return;              // locked: nothing to wire
    stage.querySelectorAll('input[name="q"]').forEach(input => {
      input.addEventListener('change', () => {
        if (q.type === 'single'){
          answers[q.n] = [Number(input.value)];
          saveDraft();
          stage.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', o.querySelector('input').checked));
        } else {
          answers[q.n] = [...stage.querySelectorAll('input[name="q"]:checked')].map(i => Number(i.value));
          input.closest('.opt').classList.toggle('on', input.checked);
          saveDraft();
        }
        say('');
      });
    });
    return;
  }

  if (q.type === 'number'){
    const box = document.getElementById('num');
    box.addEventListener('input', () => { answers[q.n] = box.value; saveDraft(); });
    return;
  }

  if (q.type === 'datetime'){
    const box = document.getElementById('when');
    box.addEventListener('input', () => { answers[q.n] = box.value; saveDraft(); });
    return;
  }

  if (q.type === 'assign'){
    if (checked[q.n]) return;                   // marked: the board is a result now
    const board = document.getElementById('board');
    const tray  = document.getElementById('tray');
    const stage = document.getElementById('stage');

    let heldItem = null;      // the item being moved, by its place in the list
    let ghost = null;         // what follows the finger
    let moved = false;        // a drag, rather than a tap

    const targetAt = (x, y) => {
      const el = document.elementFromPoint(x, y);
      return el && el.closest('[data-t]');
    };
    const clearOver = () => board.querySelectorAll('.over')
      .forEach(el => el.classList.remove('over'));

    function hold(i, el, e){
      heldItem = i;
      moved = false;
      el.classList.add('held');
      ghost = el.cloneNode(true);
      ghost.classList.add('ghost');
      ghost.style.width = el.getBoundingClientRect().width + 'px';
      document.body.appendChild(ghost);
      moveGhost(e.clientX, e.clientY);
      ghost.style.display = 'none';             // only shown once it actually moves
    }

    function moveGhost(x, y){
      if (!ghost) return;
      ghost.style.left = (x - ghost.offsetWidth / 2) + 'px';
      ghost.style.top  = (y - 22) + 'px';
    }

    function put(i, t){
      const placed = answers[q.n];
      placed[i] = t;                            // null puts it back in the tray
      saveDraft();
      say('');
      draw();                                   // redraw the board in its new state
    }

    function letGo(){
      if (ghost){ ghost.remove(); ghost = null; }
      document.querySelectorAll('.chip.held').forEach(el => el.classList.remove('held'));
      clearOver();
    }

    stage.addEventListener('pointerdown', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      e.preventDefault();
      const i = Number(chip.dataset.i);
      // Tapping the one already in hand puts it down again.
      if (heldItem === i){ heldItem = null; letGo(); return; }
      hold(i, chip, e);
      try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    });

    stage.addEventListener('pointermove', e => {
      if (heldItem == null || !ghost) return;
      moved = true;
      ghost.style.display = '';
      moveGhost(e.clientX, e.clientY);
      clearOver();
      const over = targetAt(e.clientX, e.clientY);
      if (over) over.classList.add('over');
    });

    function drop(e){
      if (heldItem == null) return;
      const where = targetAt(e.clientX, e.clientY);
      const i = heldItem;
      if (!moved){
        // A tap: keep it in hand and wait for the place to put it, unless the
        // tap was on a chip that is already somewhere, which sends it back.
        const placed = answers[q.n];
        if (placed[i] != null){ heldItem = null; letGo(); put(i, null); }
        return;
      }
      letGo();
      heldItem = null;
      if (where) put(i, where.dataset.t === undefined ? null : Number(where.dataset.t));
      else if (e.target.closest('#tray')) put(i, null);
    }
    stage.addEventListener('pointerup', drop);
    stage.addEventListener('pointercancel', () => { heldItem = null; letGo(); });

    // The second half of a tap: having picked something up, tap where it goes.
    stage.addEventListener('click', e => {
      if (heldItem == null) return;
      const where = e.target.closest('[data-t]');
      // A row is a thing to pick up, not somewhere to drop: tapping one while
      // holding another should swap which is held, not throw it back.
      const backToTray = !e.target.closest('.row, .chip') && e.target.closest('#tray');
      if (!where && !backToTray) return;
      const i = heldItem;
      heldItem = null;
      letGo();
      put(i, where ? Number(where.dataset.t) : null);
    });
    return;
  }

  if (q.type === 'scale'){
    const bar = document.getElementById('scale');
    const now = document.getElementById('scaleNow');
    bar.addEventListener('input', () => {
      answers[q.n] = Number(bar.value);
      now.textContent = bar.value;
      saveDraft();
    });
    return;
  }

  if (q.type === 'order'){
    if (checked[q.n]) return;                 // marked: it is a result now
    const steps = q.steps || [];
    const list = document.getElementById('droplist');
    let dragging = null;                      // the step being moved, by its own id

    function rows(){ return [...list.querySelectorAll('.step')]; }

    function redrawOrder(){
      const arrangement = answers[q.n] || [];
      list.innerHTML = arrangement.map((was, i) => {
        const step = steps.find(x => x.was === was);
        return `<div class="step ${was === dragging ? 'lifted' : ''}" data-was="${was}">
          <span class="grip" aria-label="Drag to move">\u22ee\u22ee</span>
          <span class="pos">${i + 1}</span>
          <span>${esc(step ? step.text : '')}</span></div>`;
      }).join('');
    }

    // Where in the list is this pointer? Above the first row means the top,
    // below the last means the bottom; otherwise whichever row it is over.
    function indexAt(y){
      const r = rows();
      if (!r.length) return 0;
      if (y < r[0].getBoundingClientRect().top) return 0;
      if (y > r[r.length - 1].getBoundingClientRect().bottom) return r.length - 1;
      for (let i = 0; i < r.length; i++){
        const box = r[i].getBoundingClientRect();
        if (y >= box.top && y <= box.bottom) return i;
      }
      return r.length - 1;
    }

    list.addEventListener('pointerdown', e => {
      // Only the handle drags. Anywhere else and the list scrolls as usual.
      if (!e.target.closest('.grip')) return;
      const row = e.target.closest('.step');
      if (!row) return;
      dragging = Number(row.dataset.was);
      try { list.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
      redrawOrder();
    });

    list.addEventListener('pointermove', e => {
      if (dragging === null) return;
      e.preventDefault();
      const arrangement = answers[q.n];
      const from = arrangement.indexOf(dragging);
      const to = indexAt(e.clientY);
      if (to === from || to < 0) return;
      arrangement.splice(to, 0, arrangement.splice(from, 1)[0]);
      redrawOrder();
    });

    function drop(){
      if (dragging === null) return;
      dragging = null;
      saveDraft();
      say('');
      redrawOrder();
    }
    list.addEventListener('pointerup', drop);
    list.addEventListener('pointercancel', drop);
    return;
  }

  if (q.type === 'hotspot'){
    if (checked[q.n]) return;                 // marked: the picture is a result now
    const shot = document.getElementById('shot');
    const pan  = document.getElementById('pan');
    const pic  = document.getElementById('shotimg');

    // Zoom state. The picture is scaled about the top-left of .pan and then
    // shifted; clamp() keeps it covering the frame so you cannot drag it off
    // into empty space.
    const MAX = 5;
    let z = 1, ox = 0, oy = 0;

    function clamp(){
      const frame = shot.getBoundingClientRect();
      const w = frame.width * z, h = (pic.offsetHeight || frame.height) * z;
      ox = z <= 1 ? 0 : Math.min(0, Math.max(frame.width - w, ox));
      oy = z <= 1 ? 0 : Math.min(0, Math.max(frame.height - h, oy));
    }

    function apply(){
      clamp();
      pan.style.transform = `translate(${ox}px, ${oy}px) scale(${z})`;
      pan.style.setProperty('--inv', 1 / z);
      const lvl = document.getElementById('zoomlvl');
      if (lvl) lvl.textContent = z.toFixed(1) + '\u00d7';
      shot.querySelectorAll('.zoomctl button').forEach(b => {
        if (b.dataset.zoom === 'in')  b.disabled = z >= MAX - 0.001;
        if (b.dataset.zoom === 'out') b.disabled = z <= 1.001;
      });
    }

    // Zoom about a point on screen, so what is under the fingers stays there.
    function zoomTo(next, cx, cy){
      const frame = shot.getBoundingClientRect();
      const px = cx - frame.left, py = cy - frame.top;
      const was = z;
      z = Math.min(MAX, Math.max(1, next));
      ox = px - (px - ox) * (z / was);
      oy = py - (py - oy) * (z / was);
      apply();
    }

    shot.closest('.slide').querySelectorAll('.zoomctl button').forEach(btn => {
      btn.addEventListener('click', () => {
        const frame = shot.getBoundingClientRect();
        const cx = frame.left + frame.width / 2, cy = frame.top + frame.height / 2;
        if (btn.dataset.zoom === 'in')  zoomTo(z * 1.6, cx, cy);
        if (btn.dataset.zoom === 'out') zoomTo(z / 1.6, cx, cy);
        if (btn.dataset.zoom === 'reset'){ z = 1; ox = 0; oy = 0; apply(); }
      });
    });

    // One pointer drags (once zoomed in) or taps; two pinch.
    const live = new Map();
    let start = null, pinch = null, moved = 0;

    shot.addEventListener('pointerdown', e => {
      try { shot.setPointerCapture(e.pointerId); } catch (err) {}   // not every pointer can be captured
      live.set(e.pointerId, { x: e.clientX, y: e.clientY });
      moved = 0;
      if (live.size === 1) start = { x: e.clientX, y: e.clientY, ox, oy, t: Date.now() };
      if (live.size === 2){
        const [a, b] = [...live.values()];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z };
      }
    });

    shot.addEventListener('pointermove', e => {
      if (!live.has(e.pointerId)) return;
      live.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (live.size === 2 && pinch){
        const [a, b] = [...live.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        moved = 99;                             // a pinch is never a tap
        if (pinch.d > 0) zoomTo(pinch.z * (d / pinch.d), (a.x + b.x) / 2, (a.y + b.y) / 2);
        return;
      }

      if (live.size === 1 && start){
        const dx = e.clientX - start.x, dy = e.clientY - start.y;
        moved = Math.max(moved, Math.hypot(dx, dy));
        if (z > 1){ ox = start.ox + dx; oy = start.oy + dy; apply(); }
      }
    });

    function release(e){
      live.delete(e.pointerId);
      if (live.size < 2) pinch = null;
      if (live.size === 0) start = null;
    }
    shot.addEventListener('pointercancel', release);

    shot.addEventListener('pointerup', e => {
      const wasOne = live.size === 1;
      const quiet = moved < 10;
      release(e);
      if (!wasOne || !quiet) return;            // a drag or a pinch, not a tap

      mark(e);
    });

    const redraw = () => {
      const taps = answers[q.n] || [];
      document.getElementById('layer').innerHTML = taps
        .map((t, i) => `<div class="tap" data-i="${i}" style="left:${t.x}%;top:${t.y}%;"><b>${i + 1}</b></div>`).join('');
      const counter = document.getElementById('tapcount');
      if (counter) counter.textContent =
        `${taps.length} of ${q.maxTaps} taps used · ${q.toFind} problems to find`;
    };

    function mark(e){
      // Before the picture has loaded the box has no height, so a tap would
      // be recorded in the wrong place entirely.
      if (!pic || !pic.complete || !pic.naturalWidth){
        say('Give the picture a second to load.');
        return;
      }
      const taking = document.elementFromPoint(e.clientX, e.clientY);
      const onMark = taking && taking.closest ? taking.closest('.tap') : null;
      const taps = Array.isArray(answers[q.n]) ? answers[q.n] : (answers[q.n] = []);

      if (onMark){                            // tapping a mark takes it back
        taps.splice(Number(onMark.dataset.i), 1);
      } else {
        if (taps.length >= q.maxTaps){
          say(`That is all ${q.maxTaps} taps. Take one back if you want to move it.`);
          return;
        }
        // Measured against the picture's own box, which already carries the
        // zoom and the pan, so the percentage is right at any magnification.
        const box = pic.getBoundingClientRect();
        taps.push({
          x: +(((e.clientX - box.left) / box.width) * 100).toFixed(2),
          y: +(((e.clientY - box.top) / box.height) * 100).toFixed(2),
        });
      }
      saveDraft();
      say('');
      redraw();
    }

    if (pic.complete) apply(); else pic.addEventListener('load', apply, { once: true });
    return;
  }

  if (q.type === 'photo'){
    drawThumbs(q);
    document.getElementById('shoot').addEventListener('click', () => document.getElementById('file').click());
    document.getElementById('file').addEventListener('change', e => addPhotos(q, e.target));
    return;
  }

  const field = document.getElementById('field');
  const onType = () => { answers[q.n] = field.value; saveDraft(); say(''); if (looksLikeStore(q)) drawStores(field.value); };
  field.addEventListener('input', onType);
  field.addEventListener('change', onType);
  if (looksLikeStore(q) && STORES.length) drawStores(field.value);
}

// The list narrows as they type, so a store number is a few taps either way.
function drawStores(typed){
  const box = document.getElementById('storeList');
  if (!box) return;
  const needle = String(typed || '').trim().toLowerCase();
  const hits = (needle
    ? STORES.filter(s => s.num.toLowerCase().includes(needle) || s.name.toLowerCase().includes(needle))
    : STORES).slice(0, 60);

  if (!hits.length){
    box.innerHTML = '<div class="none">No store matches that. You can still type the number.</div>';
    return;
  }
  box.innerHTML = hits.map(s =>
    `<button type="button" data-num="${esc(s.num)}"><b>${esc(s.num)}</b>${s.name ? ' — ' + esc(s.name) : ''}</button>`).join('');

  box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const q = FORM.questions[at];
    answers[q.n] = b.dataset.num;
    document.getElementById('field').value = b.dataset.num;
    saveDraft();
    drawStores(b.dataset.num);
    say('');
  }));
}

// ── Marking ─────────────────────────────────────────────────────────────────
async function check(q){
  if (checked[q.n]) return true;
  try{
    // Marked once, and the server keeps the first answer, so a second go at
    // a dropped request costs nothing and saves a question being written off
    // as "no signal" when the phone just blinked.
    let res;
    for (let attempt = 1; attempt <= 3; attempt++){
      try {
        res = await fetch('/api/audits/check', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ auditId: FORM.id, walkId: WALK_ID, n: q.n, answer: answers[q.n] }),
        });
        if (res.status < 500 || attempt === 3) break;
      } catch (err) {
        if (attempt === 3) throw err;
      }
      say('Checking…');
      await new Promise(r => setTimeout(r, attempt * 900));
    }
    if (!res.ok){
      // The server turned it down — say why, and leave the question open so
      // they can put it right. This is not the same as having no signal.
      const data = await res.json().catch(() => ({}));
      say(data.error || 'That did not go through. Try again.');
      return false;
    }
    checked[q.n] = await res.json();
  }catch(err){
    // No signal is not a reason to stop the walk.
    checked[q.n] = { offline: true };
  }
  draw();
  // The verdict lands below the answers, which on a phone is off the bottom
  // of the screen. Bring it up rather than leaving them to find it.
  const panel = document.querySelector('.verdict');
  if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (COACH !== 'none' && checked[q.n] && checked[q.n].correct) celebrate();
  return true;
}

// ── Moving between questions ────────────────────────────────────────────────
function answered(q){
  if (!q) return true;
  if (q.required === false) return true;
  if (q.type === 'photo') return (photos[q.n] || []).length > 0;
  if (q.type === 'order') return (answers[q.n] || []).length === (q.steps || []).length;
  if (q.type === 'assign'){
    const placed = answers[q.n] || [];
    return (q.items || []).every(it => placed[it.i] != null);
  }
  const v = answers[q.n];
  return Array.isArray(v) ? v.length > 0 : String(v || '').trim() !== '';
}

function go(by){
  if (by > 0 && at >= 0){
    const q = FORM.questions[at];
    if (!answered(q)){
      say(q.type === 'photo' ? 'Take at least one picture before you move on.'
                             : 'Answer this one before you move on.');
      return;
    }
    // A scored question gets marked before it is left, so nobody reaches the
    // end without having seen what they got wrong.
    if (isGraded(q) && !checked[q.n]) return void check(q);
    if (at === FORM.questions.length - 1) return submit();
  }
  const to = at + by;
  if (to < -1 || to >= FORM.questions.length) return;
  at = to;
  draw(by < 0 ? 'back' : 'next');
}

function say(message, calm){
  const box = document.getElementById('msg');
  box.textContent = message || '';
  box.className = 'msg' + (calm ? ' calm' : '');
  box.style.display = message ? 'block' : 'none';
}

// Waiting to send, because four tries could not get through. The walk is not
// lost and nobody has to do anything: the moment the phone has signal again,
// or the page is looked at again, it goes by itself. The only way to lose it
// from here is to close the page, which is why that is the one thing the
// message asks of them.
let WAITING_TO_SEND = false;

function waitForSignal(){
  if (WAITING_TO_SEND) return;
  WAITING_TO_SEND = true;
  const again = () => {
    if (!WAITING_TO_SEND) return;
    if (navigator.onLine === false) return;
    WAITING_TO_SEND = false;
    submit();
  };
  window.addEventListener('online', again);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) again(); });
  // And a slow heartbeat, because a phone that never fires `online` is a
  // real phone, not a hypothetical one.
  setInterval(again, 20000);
}

document.getElementById('next').addEventListener('click', () => RETRY ? retryNext() : go(1));
document.getElementById('back').addEventListener('click', () => go(-1));

// A keyboard works too, for anyone filling this in on a laptop.
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName) && e.key !== 'Enter') return;
  if (e.key === 'ArrowRight' || e.key === 'Enter') return RETRY ? retryNext() : go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

// ── Photos ──────────────────────────────────────────────────────────────────
//
// Shrink on the phone: longest side 1600px, JPEG 0.7. A full round of 40+
// stores at full phone resolution would fill the storage bucket.
function shrink(file){
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.width  * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          URL.revokeObjectURL(url);
          // No blob means the canvas could not read it — send the original.
          resolve(blob ? new File([blob], 'photo.jpg', { type: 'image/jpeg' }) : file);
        }, 'image/jpeg', 0.7);
      }catch(err){ URL.revokeObjectURL(url); resolve(file); }
    };
    // iPhone HEIC the browser cannot decode: upload the original instead.
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function addPhotos(q, input){
  const max = q.maxPhotos || 3;
  photos[q.n] = photos[q.n] || [];
  const btn = document.getElementById('shoot');
  btn.textContent = 'Getting the picture ready…';

  for (const file of [...input.files]){
    if (photos[q.n].length >= max) break;
    let small = await shrink(file);
    // On an annotation question the drawing is the answer, so it opens
    // straight away rather than waiting to be found.
    if (q.annotate) small = await drawOn(small);
    photos[q.n].push({ file: small, url: URL.createObjectURL(small) });
  }
  input.value = '';
  drawThumbs(q);
  say('');
}

// Draw on a photo and get the photo back with the drawing baked in, so
// what gets uploaded is one picture and nothing downstream has to know.
function drawOn(blob){
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const over = document.createElement('div');
      over.className = 'draw-over';
      const COLOURS = ['#e11d2a', '#ffd400', '#1cb145', '#111827'];
      over.innerHTML = `<canvas></canvas>
        <div class="draw-bar">
          ${COLOURS.map((c, i) => `<button class="pen ${i === 0 ? 'on' : ''}"
             data-c="${c}" style="background:${c}" aria-label="Pen colour"></button>`).join('')}
          <button data-act="undo">Undo</button>
          <button data-act="clear">Clear</button>
          <button class="go" data-act="done">Done</button>
        </div>`;
      document.body.appendChild(over);

      const canvas = over.querySelector('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      // Thick enough to see on a phone, measured against the picture rather
      // than the screen, so it looks the same whatever size it is drawn at.
      const WIDTH = Math.max(4, Math.round(img.width / 160));
      let colour = COLOURS[0];
      const strokes = [];
      let drawing = null;

      function repaint(){
        ctx.drawImage(img, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (const st of strokes){
          ctx.strokeStyle = st.c;
          ctx.lineWidth = WIDTH;
          ctx.beginPath();
          st.pts.forEach((pt, i) => i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y));
          ctx.stroke();
        }
      }
      repaint();

      const at = e => {
        const box = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - box.left) / box.width) * canvas.width,
          y: ((e.clientY - box.top) / box.height) * canvas.height,
        };
      };

      canvas.addEventListener('pointerdown', e => {
        e.preventDefault();
        drawing = { c: colour, pts: [at(e)] };
        strokes.push(drawing);
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      });
      canvas.addEventListener('pointermove', e => {
        if (!drawing) return;
        drawing.pts.push(at(e));
        repaint();
      });
      const stop = () => { drawing = null; };
      canvas.addEventListener('pointerup', stop);
      canvas.addEventListener('pointercancel', stop);

      over.querySelector('.draw-bar').addEventListener('click', e => {
        const pen = e.target.closest('.pen');
        if (pen){
          colour = pen.dataset.c;
          over.querySelectorAll('.pen').forEach(b => b.classList.toggle('on', b === pen));
          return;
        }
        const act = (e.target.closest('[data-act]') || {}).dataset;
        if (!act) return;
        if (act.act === 'undo'){ strokes.pop(); repaint(); return; }
        if (act.act === 'clear'){ strokes.length = 0; repaint(); return; }
        if (act.act === 'done'){
          canvas.toBlob(out => {
            over.remove();
            URL.revokeObjectURL(url);
            resolve(out || blob);
          }, 'image/jpeg', 0.82);
        }
      });
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(blob); };
    img.src = url;
  });
}

function drawThumbs(q){
  const list = photos[q.n] || [];
  const max = q.maxPhotos || 3;
  document.getElementById('thumbs').innerHTML = list.map((p, i) =>
    `<div class="thumb"><img src="${p.url}" alt="">
       <button type="button" data-i="${i}" aria-label="Remove this picture">×</button>
       <button type="button" class="pen-btn" data-i="${i}" aria-label="Draw on this picture">✎</button>
     </div>`).join('');

  document.querySelectorAll('.thumb button:not(.pen-btn)').forEach(b => b.addEventListener('click', () => {
    photos[q.n].splice(Number(b.dataset.i), 1);
    drawThumbs(q);
  }));

  // Any picture can be drawn on afterwards, not only on an annotation
  // question: circling the thing you mean beats describing where it is.
  document.querySelectorAll('.thumb .pen-btn').forEach(b => b.addEventListener('click', async () => {
    const i = Number(b.dataset.i);
    const shot = photos[q.n][i];
    const drawn = await drawOn(shot.file);
    URL.revokeObjectURL(shot.url);
    photos[q.n][i] = { file: drawn, url: URL.createObjectURL(drawn) };
    drawThumbs(q);
  }));

  const btn = document.getElementById('shoot');
  btn.textContent = list.length >= max ? `You have ${max} pictures`
                  : (list.length ? 'Take another picture' : 'Take a picture');
  btn.disabled = list.length >= max;
}

// ── Sending ─────────────────────────────────────────────────────────────────
let SENDING = false;

// The walk goes in once, however many times this is called: the server keys
// it on the walk id. That is what makes retrying safe, and retrying is what
// stops a dropped reply looking like a failure to the person holding the
// phone. A deploy, a lift door, a dead spot behind the walk-in — all the
// same thing to a phone mid-request, and all of them recover on their own.
const TRIES = 4;
const WAIT_MS = [1200, 3000, 6000];
// Long enough for a handful of photos on a bad connection, short enough that
// a request which is never coming back does not hold the walk hostage.
const GIVE_UP_MS = 90000;

async function sendWalk(body, next, count){
  let last;
  for (let attempt = 1; attempt <= TRIES; attempt++){
    const stop = new AbortController();
    const timer = setTimeout(() => stop.abort(), GIVE_UP_MS);
    try {
      const res = await fetch('/api/audits/submit',
        { method: 'POST', body, signal: stop.signal });
      clearTimeout(timer);
      // A 5xx is the server having a moment — worth another go. A 4xx is an
      // answer about this submission and will say the same thing next time.
      if (res.status >= 500 && attempt < TRIES){ last = new Error('server ' + res.status); }
      else return res;
    } catch (err) {
      clearTimeout(timer);
      last = err;
    }
    if (attempt < TRIES){
      next.textContent = `Still sending… (${attempt + 1} of ${TRIES})`;
      say('');
      await new Promise(r => setTimeout(r, WAIT_MS[attempt - 1] || 6000));
    }
  }
  throw last || new Error('could not send');
}

async function submit(){
  if (SENDING) return;                 // a double tap is one submission
  WAITING_TO_SEND = false;
  const missing = FORM.questions.map((q, i) => answered(q) ? null : i).filter(i => i !== null);
  if (missing.length){
    at = missing[0];
    draw();
    say('This one is not finished yet.');
    return;
  }

  const next = document.getElementById('next');
  const body = new FormData();
  body.append('auditId', FORM.id);
  body.append('walkId', WALK_ID);
  body.append('answers', JSON.stringify(answers));
  let count = 0;
  for (const [n, list] of Object.entries(photos)){
    for (const p of list){ body.append('photo_' + n, p.file, 'photo.jpg'); count++; }
  }

  SENDING = true;
  next.disabled = true;
  next.textContent = `Sending ${count} pictures…`;
  say('');

  try{
    const res = await sendWalk(body, next, count);
    // When the app is restarting, the proxy in front of it answers with its
    // own page instead of ours. That is not a reply to this walk, and reading
    // it as one threw — which is how a server problem came out on the phone
    // as "no signal", with the person hunting for a better connection.
    const data = await res.json().catch(() => null);
    if (!res.ok || !data){
      // Everything they typed and every picture is still here.
      next.disabled = false; next.textContent = 'Send my answers';
      SENDING = false;
      if (!data){
        say(`The server could not take it just now (${res.status}). Everything `
          + 'you did is saved on this phone and it keeps trying on its own — '
          + 'just leave this page open. It cannot go in twice.', true);
        waitForSignal();
        return;
      }
      if ((data.missing || []).length){
        const first = FORM.questions.findIndex(q => q.n === data.missing[0].n);
        if (first >= 0){ at = first; draw(); }
      }
      say(data.error || 'That did not send. Try again.');
      return;
    }
    clearDraft();
    showResults(data);
  }catch(err){
    // It may well have arrived and only the reply got lost, which is what
    // happened before the walk id was made unique. Pressing the button again
    // is safe now: the same walk cannot go in twice.
    SENDING = false;
    next.disabled = false; next.textContent = 'Send my answers';
    say('No signal right now. Everything you did is saved on this phone and '
      + 'will send on its own as soon as you are back in range — just leave '
      + 'this page open. You can also press the button yourself; it cannot '
      + 'go in twice.', true);
    waitForSignal();
  }
}

// ── Going back over the ones they missed ────────────────────────────────────
//
// Answering a second time is where the learning is; reading the explanation
// again is not. So this is a real second go at the questions they got wrong,
// not a recap.
//
// It changes no score. The walk is submitted and frozen, and they have just
// been shown the answers, so a mark now would mean nothing. It is practice,
// and it says so.
//
// Marking happens here on the phone rather than at the server, because the
// answer key is already here — it arrived with the results a moment ago.
let RETRY = null;             // { list: [result], at, right }

function missedFrom(data){
  return (data.results || []).filter(r => !r.correct);
}

function startRetry(data){
  RETRY = { list: missedFrom(data), at: 0, right: 0, data };
  for (const r of RETRY.list){
    delete answers[r.n];
    delete checked[r.n];
  }
  drawRetry();
}

function retryQuestion(){
  const r = RETRY.list[RETRY.at];
  return FORM.questions.find(q => q.n === r.n);
}

// Marked against the key that came back with the results.
function markRetry(q, r){
  const given = answers[q.n];
  if (q.type === 'order'){
    const steps = q.steps || [];
    const picked = Array.isArray(given) ? given : [];
    return picked.length === steps.length && picked.every((was, i) => was === (r.rightOrder || [])[i]);
  }
  if (q.type === 'assign'){
    const placed = Array.isArray(given) ? given : [];
