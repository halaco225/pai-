databases:
  - name: pai-db
    plan: free
    databaseName: pai
    user: pai

services:

  - type: web
    name: pai-ayvaz
    env: node
    plan: starter
    buildCommand: npm install && npx playwright install --with-deps chromium
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pai-db
          property: connectionString
      # ── OneData (DBS / SOS / Forgot Clock Out) ──────────────
      - key: ODS_URL
        value: https://bi.onedatasource.com
      - key: ODS_ORG
        value: dgi
      - key: ODS_USER
        sync: false
      - key: ODS_PASSWORD
        sync: false
      # ── Fourth Analytics ────────────────────────────────────
      - key: FOURTH_USER
        sync: false
      - key: FOURTH_PASSWORD
        sync: false
      # ── SMG Comments ────────────────────────────────────────
      - key: SMG_USER
        sync: false
      - key: SMG_PASSWORD
        sync: false
      # ── Hut Bot / Yum SuperApp ──────────────────────────────
      - key: HUTBOT_USER
        sync: false
      - key: HUTBOT_PASSWORD
        sync: false
      # ── Automation tokens ───────────────────────────────────
      - key: VELOCITY_AUTOMATION_TOKEN
        generateValue: true
      - key: INTEL_AUTOMATION_TOKEN
        value: 38b8091924e1f85583454212a9860038
      # Playwright: install browsers into project dir so they survive restarts
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"

  - type: cron
    name: velocity-ods-pull
    env: node
    plan: starter
    schedule: "0 10 * * *"
    buildCommand: npm install
    startCommand: node scripts/velocity-cron-pull.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pai-db
          property: connectionString
      - key: PAI_BASE_URL
        value: https://pai-ayvaz.onrender.com
      - key: VELOCITY_AUTOMATION_TOKEN
        value: 022f4a0fa4e2ec99541609c47744d599

  - type: cron
    name: intel-dbs-pull
    env: node
    plan: starter
    schedule: "0 10 * * *"
    buildCommand: npm install
    startCommand: node scripts/intel-cron.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pai-db
          property: connectionString
      - key: PAI_BASE_URL
        value: https://pai-ayvaz.onrender.com
      - key: INTEL_AUTOMATION_TOKEN
        value: 38b8091924e1f85583454212a9860038
