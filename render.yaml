databases:
  - name: pai-db
    plan: free
    databaseName: pai
    user: pai

services:

  - type: web
    name: pai-ayvaz
    env: node
    plan: starter
    # PLAYWRIGHT_BROWSERS_PATH=0 installs the browser inside node_modules, which
    # is part of the build output and therefore survives into the running
    # service. The previous command wrote to a sibling directory that was not
    # there at runtime -- every candidate path came back missing, so no
    # browser-driven step has ever worked: WIN score, SMG comments, HutBot.
    # The install is no longer swallowed by `|| true`, so a failure fails the
    # build instead of producing a deploy that silently cannot browse.
    buildCommand: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium-headless-shell && (PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install-deps chromium-headless-shell || true)
    startCommand: bash startup.sh
    envVars:
      - key: NODE_ENV
        value: production
      # 0 means "inside node_modules", matching the build above.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      # ── Anthropic / Claude ──────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pai-db
          property: connectionString
      # ── OneData (DBS / SOS / Forgot Clock Out) ──────────────
      - key: ODS_URL
        value: https://bi.onedatasource.com
      - key: ODS_ORG
        value: dgi
      - key: ODS_USER
        sync: false
      - key: ODS_PASSWORD
        sync: false
      # ── Fourth Analytics ────────────────────────────────────
      - key: FOURTH_USER
        sync: false
      - key: FOURTH_PASSWORD
        sync: false
      # ── SMG Comments ────────────────────────────────────────
      - key: SMG_USER
        sync: false
      - key: SMG_PASSWORD
        sync: false
      # ── Hut Bot / Yum SuperApp ──────────────────────────────
      - key: HUTBOT_USER
        sync: false
      - key: HUTBOT_PASSWORD
        sync: false
      - key: HUTBOT_PROFILE_DIR
        value: /tmp/hutbot-profile
      # ── Automation tokens ───────────────────────────────────
      - key: VELOCITY_AUTOMATION_TOKEN
        value: 022f4a0fa4e2ec99541609c47744d599
      - key: INTEL_AUTOMATION_TOKEN
        value: 38b8091924e1f85583454212a9860038
      # ── RC Tracker's Supabase (follow-ups, SMS history, consent) ──
      # Same project RC Tracker uses. Read and written in place; nothing is
      # migrated, so there is no window in which rows can be lost.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # ── Twilio — the SAME number RC Tracker uses ──
      # Outbound only. RC Tracker still owns the inbound webhook and the status
      # callback, so its replies, STOP/START and delivery logging are untouched.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # ── Morning brief by text ──
      - key: PAI_BASE_URL
        value: https://pai-ayvaz.onrender.com
      - key: PAI_BRIEF_RECIPIENTS
        value: hlacoste,mhester,dspikes,esimmons,jmcneil,jgarcia,mgannon,mmeehan
      - key: PAI_BRIEF_SEND_LOCAL_TIME
        value: "08:05"

  # The velocity-ods-pull cron that used to be declared here was never
  # actually running in Render — only intel-dbs-pull below ever fired. The
  # velocity pull is now triggered in-process by services/scheduler.js (see
  # that file for why), with .github/workflows/velocity-cron.yml as a backstop.

  - type: cron
    name: intel-dbs-pull
    env: node
    plan: starter
    # 10:00 UTC = 6am Eastern during EDT, 5am during EST. This is only the
    # trigger — services/scheduler.js gates on Eastern local time, so the
    # hour this fires does not decide when the pull is allowed to run.
    schedule: "0 10 * * *"
    buildCommand: npm install
    startCommand: node scripts/intel-cron.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pai-db
          property: connectionString
      - key: PAI_BASE_URL
        value: https://pai-ayvaz.onrender.com
      - key: INTEL_AUTOMATION_TOKEN
        value: 38b8091924e1f85583454212a9860038
